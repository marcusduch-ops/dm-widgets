<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <style>
    :root{--accent:#E6335A;--accent-dark:#C71F45;--navy:#1f2d5a;--bg:#f4f6f8;--line:#e3e6ea;--ink:#2a2f45;--firstcol:260px}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
    .wrap{padding:16px}
    .head{display:flex;gap:8px;align-items:center;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .head button{padding:6px 12px;border:1px solid #cfd4da;background:#fff;border-radius:6px;cursor:pointer;font-size:14px}
    .head button:hover{background:#f0f2f5}
    #weeklabel{font-weight:700;color:var(--navy)}
    .save{margin-left:auto;background:var(--accent)!important;color:#fff!important;border:none!important;font-weight:600}
    .save:hover{background:var(--accent-dark)!important}
    h3{color:var(--navy);font-size:15px;margin:14px 0 6px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px}
    table{border-collapse:collapse;width:100%;table-layout:fixed}
    th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;text-align:center;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    th:last-child,td:last-child{border-right:none}
    th{background:var(--accent);color:#fff;font-weight:600}
    th:first-child,td:first-child{text-align:left;width:var(--firstcol);white-space:normal}
    col.day{width:auto}
    td input{width:100%;box-sizing:border-box;text-align:right;border:1px solid #d5d9df;border-radius:4px;padding:3px 4px}
    td input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
    .locked{background:#f1f1f1;color:#888}
    .addbtn{background:#fff;border:1px dashed var(--accent);color:var(--accent);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:600}
    .addbtn:hover{background:#fbe9ee}
    .ok{color:#137333;font-weight:600}.under{color:#d97706;font-weight:600}.over{color:var(--accent-dark);font-weight:700}
    #modal{display:none;position:fixed;inset:0;background:rgba(20,25,50,.4);align-items:center;justify-content:center;z-index:50}
    #modal .box{background:#fff;padding:20px;border-radius:12px;width:440px;max-height:82vh;overflow:auto;margin:auto;box-shadow:0 8px 30px rgba(0,0,0,.25)}
    #modal .box strong{color:var(--navy);font-size:16px}
    #modal input,#modal select{width:100%;padding:7px;margin:5px 0;box-sizing:border-box;border:1px solid #cfd4da;border-radius:6px}
    #modal .box>button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600}
    #modal .box>button:hover{background:var(--accent-dark)}
    #catalog .row{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid #eee;align-items:center}
    #catalog .row button{background:var(--accent);color:#fff;border:none;border-radius:5px;padding:4px 12px;cursor:pointer}
    #catalog .row button:disabled{background:#c9ccd2;cursor:default}
    #balance .panel{margin-top:4px}
  </style>
</head>
<body>
 <div class="wrap">
  <div class="head">
    <button onclick="shiftWeek(-1)">&larr; Forrige</button>
    <span id="weeklabel">Uge ...</span>
    <button onclick="shiftWeek(1)">Næste &rarr;</button>
    <button class="save" onclick="saveWeek()">Gem uge</button>
  </div>
  <h3>Fravær</h3>
  <div class="panel"><table id="absence">
    <colgroup><col class="first"><col class="day"><col class="day"><col class="day"><col class="day"><col class="day"><col class="day"><col class="day"></colgroup>
    <thead><tr><th>Type</th><th>Man</th><th>Tir</th><th>Ons</th><th>Tor</th><th>Fre</th><th>Lør</th><th>Søn</th></tr></thead><tbody></tbody></table></div>
  <h3>Projekter &amp; interne timer</h3>
  <div class="panel"><table id="services">
    <colgroup><col class="first"><col class="day"><col class="day"><col class="day"><col class="day"><col class="day"><col class="day"><col class="day"></colgroup>
    <thead><tr><th>Ydelse</th><th>Man</th><th>Tir</th><th>Ons</th><th>Tor</th><th>Fre</th><th>Lør</th><th>Søn</th></tr></thead><tbody></tbody></table></div>
  <button class="addbtn" onclick="openCatalog()">+ Tilføj ydelse</button>
  <div id="balance"></div>
 </div>
  <div id="modal"><div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center"><strong>Tilføj en ydelse</strong><span style="cursor:pointer;font-size:20px" onclick="closeCatalog()">&times;</span></div>
    <input id="search" placeholder="Søg..." oninput="renderCatalog()">
    <div id="catalog"></div><hr>
    <button onclick="document.getElementById('createnew').style.display='block'">+ Opret ny</button>
    <div id="createnew" style="display:none">
      <select id="newtype">
        <option value="workpackage">Arbejdspakke (kræver projektnøgle)</option>
        <option value="category">Intern kategori</option>
      </select>
      <input id="newname" placeholder="Navn">
      <input id="newcode" placeholder="Projektnøgle (til arbejdspakke)">
      <button onclick="createNew()">Opret &amp; tilføj</button>
    </div>
  </div></div>
  <script>
    var WORKSPACE="danskemaritime", NORM=7.4, TOL=0.05;
    var monday, grid, catalog=[];
    function api(name,method,extra){
      var cfg={api_name:name,workspace_name:WORKSPACE,http_method:method};
      if(extra){ for(var k in extra){ cfg[k]=extra[k]; } }
      return ZOHO.CREATOR.DATA.invokeCustomApi(cfg);
    }
    function unwrap(r){ var x=(r&&r.result!==undefined)?r.result:(r&&r.data!==undefined?r.data:r); if(typeof x==="string"){try{x=JSON.parse(x);}catch(e){}} return x; }
    function iso(d){ return d.toISOString().slice(0,10); }
    function fmt(n){ return (Math.round(n*100)/100).toString().replace(".",","); }
    function initMonday(){ var d=new Date(); var dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); monday=d; }
    function loadWeek(){
      api("get_week_grid","POST",{payload:{userEmail:"self",mondayStr:iso(monday)}})
        .then(function(r){ grid=unwrap(r); render(); })
        .catch(function(e){ document.getElementById("balance").innerText="Fejl ved indlæsning: "+JSON.stringify(e); });
    }
    function makeRow(key,name,kind,days){
      var tr=document.createElement("tr"); tr.dataset.key=key; tr.dataset.kind=kind;
      var td0=document.createElement("td"); td0.innerText=name; td0.title=name; tr.appendChild(td0);
      for(var i=0;i<7;i++){
        var td=document.createElement("td"), inp=document.createElement("input");
        inp.type="number"; inp.step="0.1"; inp.min="0"; inp.max="24";
        if(days&&days[i]){ inp.value=days[i].hours||""; if(days[i].locked){inp.disabled=true; td.className="locked";} }
        inp.oninput=recalc; td.appendChild(inp); tr.appendChild(td);
      }
      return tr;
    }
    function render(){
      document.getElementById("weeklabel").innerText="Uge fra "+iso(monday);
      // brug den enkeltes dagsnorm til balancelinjen (uden for fillKey-blokken)
      if(grid.norm){ NORM = grid.norm; }
      var at=document.querySelector("#absence tbody"); at.innerHTML="";
      (grid.absence||[]).forEach(function(a){
        var tr=makeRow(a.key,a.name,"absence",a.days);
        if(a.key==="fravaer:ferie" && !grid.callerIsAdmin){
          tr.querySelectorAll("input").forEach(function(inp){ inp.disabled=true; });
          tr.title="Ferie registreres via en anmodning \u2013 ikke direkte i skemaet.";
        }
        at.appendChild(tr);
      });
      var st=document.querySelector("#services tbody"); st.innerHTML="";
      (grid.rows||[]).forEach(function(r){ st.appendChild(makeRow(r.key, r.name || r.key, "auto", r.days)); });
      if(grid.fillKey){
        var fr=Array.from(document.querySelectorAll("#services tbody tr")).find(function(tr){return tr.dataset.key===grid.fillKey;});
        if(fr){ for(var i=0;i<7;i++){ var d=new Date(monday); d.setDate(d.getDate()+i);
          var s=(grid.prefillFill||{})[iso(d)]||0; var cell=fr.children[i+1].querySelector("input");
          if(s>0 && !cell.value){ cell.value=s; } } }
      }
      recalc();
    }
    function applyAbsenceZeroing(){
      if(!grid||!grid.fillKey) return;
      var fr=Array.from(document.querySelectorAll("#services tbody tr")).find(function(tr){return tr.dataset.key===grid.fillKey;});
      if(!fr) return;
      for(var i=0;i<7;i++){
        var absSum=0;
        document.querySelectorAll("#absence tbody tr").forEach(function(tr){ absSum+=parseFloat(tr.children[i+1].querySelector("input").value)||0; });
        if(absSum>=7){ fr.children[i+1].querySelector("input").value=""; }
      }
    }
    function recalc(){
      applyAbsenceZeroing();
      var h='<h3>Daglig balance</h3><div class="panel"><table>'+
            '<colgroup><col class="first"><col class="day"><col class="day"><col class="day"><col class="day"><col class="day"><col class="day"><col class="day"></colgroup>'+
            '<tr><th></th><th>Man</th><th>Tir</th><th>Ons</th><th>Tor</th><th>Fre</th><th>Lør</th><th>Søn</th></tr><tr><td>Sum</td>';
      for(var i=0;i<7;i++){
        var dayNorm = (i>=5) ? 0 : NORM;   // weekend: udgangspunkt = 0 timer
        var sum=0;
        document.querySelectorAll("#absence tbody tr, #services tbody tr").forEach(function(tr){ sum+=parseFloat(tr.children[i+1].querySelector("input").value)||0; });
        var cls=Math.abs(sum-dayNorm)<=TOL?"ok":(sum<dayNorm?"under":"over");
        var mark=Math.abs(sum-dayNorm)<=TOL?("\u2713 "+fmt(sum)):(fmt(sum)+" ("+(sum-dayNorm>0?"+":"")+fmt(sum-dayNorm)+")");
        h+="<td class='"+cls+"'>"+mark+"</td>";
      }
      h+="</tr></table></div>"; document.getElementById("balance").innerHTML=h;
    }
    function shiftWeek(n){ monday.setDate(monday.getDate()+n*7); loadWeek(); }
    function saveWeek(){
      var rows=[];
      document.querySelectorAll("#absence tbody tr, #services tbody tr").forEach(function(tr){
        var days=[];
        for(var i=0;i<7;i++){ var d=new Date(monday); d.setDate(d.getDate()+i);
          days.push({date:iso(d),hours:parseFloat(tr.children[i+1].querySelector("input").value)||0}); }
        rows.push({key:tr.dataset.key,name:tr.children[0].innerText,kind:tr.dataset.kind,days:days});
      });
      api("saveWeek","POST",{payload:{userEmail:"self",gridJson:JSON.stringify({rows:rows})}})
        .then(function(r){ alert("Gemt: "+JSON.stringify(unwrap(r))); loadWeek(); })
        .catch(function(e){ alert("Fejl ved gemning: "+JSON.stringify(e)); });
    }
    function openCatalog(){
      document.getElementById("modal").style.display="flex";
      document.getElementById("createnew").style.display="none";
      document.getElementById("search").value="";
      api("get_active_services","GET",{}).then(function(r){ catalog=unwrap(r)||[]; renderCatalog(); });
    }
    function closeCatalog(){ document.getElementById("modal").style.display="none"; }
    function renderCatalog(){
      var q=(document.getElementById("search").value||"").toLowerCase();
      var list=document.getElementById("catalog"); list.innerHTML="";
      var already=new Set(Array.from(document.querySelectorAll("#services tbody tr")).map(function(tr){return tr.dataset.key;}));
      catalog.filter(function(x){return x.name.toLowerCase().indexOf(q)>-1||x.key.toLowerCase().indexOf(q)>-1;})
        .forEach(function(x){
          var row=document.createElement("div"); row.className="row";
          var lbl=document.createElement("span"); lbl.innerText=x.name+" ("+x.key+")";
          var btn=document.createElement("button");
          if(already.has(x.key)){ btn.innerText="Tilføjet"; btn.disabled=true; } else { btn.innerText="Tilføj"; btn.onclick=function(){addToGrid(x);}; }
          row.appendChild(lbl); row.appendChild(btn); list.appendChild(row);
        });
    }
    function addToGrid(x){ document.querySelector("#services tbody").appendChild(makeRow(x.key,x.name,x.kind)); renderCatalog(); recalc(); }
    function createNew(){
      var type=document.getElementById("newtype").value;
      var name=document.getElementById("newname").value.trim();
      var code=document.getElementById("newcode").value.trim();
      if(!name){ alert("Navn er påkrævet"); return; }
      api("create_service","POST",{payload:{type:type,name:name,code:code}}).then(function(r){
        var x=unwrap(r);
        if(x.status==="OK"){ catalog.push(x); addToGrid(x);
          document.getElementById("newname").value=""; document.getElementById("newcode").value="";
          document.getElementById("createnew").style.display="none";
        } else { alert(x.message||"Kunne ikke oprette"); }
      });
    }
    initMonday(); loadWeek();
  </script>
</body>
</html>
