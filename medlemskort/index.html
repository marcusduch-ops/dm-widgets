<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afdelingskort</title>

<!-- Leaflet (kortbibliotek) og markercluster (samler pins i klynger) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">

<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column;
         font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }

  .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
         padding: 8px 10px; border-bottom: 1px solid #e3e3e3; background: #fafafa; }
  .top select, .top input {
         padding: 6px 8px; border: 1px solid #c9c9c9; border-radius: 6px;
         font-size: 13px; background: #fff; }
  .top input { min-width: 180px; }
  .top button { padding: 6px 12px; border: 1px solid #c9c9c9; border-radius: 6px;
         background: #fff; font-size: 13px; cursor: pointer; }
  .top button:hover { background: #f0f0f0; }
  #taeller { font-size: 12.5px; color: #555; margin-left: auto; }

  #kort { flex: 1; min-height: 260px; }

  .besked { padding: 14px 16px; font-size: 14px; background: #fff7e6;
            color: #7a4b00; border-bottom: 1px solid #f0dcb4; }
  .besked.fejl { background: #fdecec; color: #8a1f1f; border-color: #f2c4c4; }

  .bund { padding: 6px 10px; font-size: 12px; color: #666;
          border-top: 1px solid #e3e3e3; background: #fafafa; }

  .pop { font-size: 13px; line-height: 1.45; max-width: 240px; }
  .pop-navn  { font-weight: 600; margin-bottom: 2px; }
  .pop-brand { color: #666; font-size: 12px; margin-bottom: 4px; }
  .pop-adr   { margin-bottom: 6px; }
  .pop-links a { color: #1a56a0; text-decoration: none; }
  .pop-links a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="top" id="filterbar" hidden>
  <select id="fLand"><option value="">Alle lande</option></select>
  <select id="fBrand"><option value="">Alle virksomheder</option></select>
  <input id="fSoeg" type="text" placeholder="Søg afdeling, by eller adresse …">
  <button id="fNulstil" type="button">Nulstil</button>
  <span id="taeller"></span>
</div>

<div class="besked" id="besked" hidden></div>
<div id="kort"></div>
<div class="bund" id="bund" hidden></div>

<!-- Zoho's SDK skal indlæses FØR vores egen kode -->
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>

<script id="hovedscript">
"use strict";

/* =====================================================================
   KONFIGURATION
   Skal matche API-navnene i jeres CRM (tjekkes ved Checkpoint 1).
   Passer navnene ikke, er det KUN her, der skal rettes.
   ===================================================================== */
const CONFIG = {
  modul: "Afdelinger",
  felter: {
    navn:    "Name",
    medlem:  "Medlem",
    brand:   "Brand",
    land:    "Land",
    adresse: "Adresse",
    postnr:  "Postnummer",
    by:      "By",
    website: "Website",
    lat:     "Latitude",
    lon:     "Longitude"
  },
  // Ved brand-genkendelse ud fra kontonavn: ignorer meget korte brands
  minBrandLaengde: 3
};

/* ===================================================================== */

let kort, cluster;
let alleRecords = [];
const tilstand = { mode: "global", kontoId: null, kontoNavn: "", brands: [] };
let startTimeout = null;

function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function F(rec, noegle) { return rec[CONFIG.felter[noegle]]; }

function visBesked(tekst, erFejl) {
  const b = $("besked");
  b.textContent = tekst;
  b.classList.toggle("fejl", !!erFejl);
  b.hidden = false;
}

function skjulBesked() { $("besked").hidden = true; }

function visFejl(fejl) {
  console.error("Afdelingskort-fejl:", fejl);
  visBesked(
    "Kortet kunne ikke hente data. Tryk F12, åbn fanen Console, " +
    "kopiér den røde fejltekst og send den i chatten – så finder vi fejlen sammen.",
    true
  );
}

/* ---------- kort ---------- */

function initKort() {
  kort = L.map("kort", { worldCopyJump: true }).setView([25, 10], 2);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-bidragydere'
  }).addTo(kort);
  cluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 45 });
  kort.addLayer(cluster);
}

function popupHtml(r) {
  const navn  = esc(F(r, "navn"));
  const brand = esc(F(r, "brand"));
  const dele  = [];
  const adr   = esc(F(r, "adresse"));
  const linje2 = [esc(F(r, "postnr")), esc(F(r, "by"))].filter(Boolean).join(" ");
  const land  = esc(F(r, "land"));
  if (adr)    dele.push(adr);
  if (linje2) dele.push(linje2);
  if (land)   dele.push(land);

  const links = [];
  const web = F(r, "website");
  if (web) links.push('<a href="' + esc(web) + '" target="_blank" rel="noopener">Hjemmeside</a>');
  links.push('<a href="#" onclick="return aabn(\'' + esc(r.id) + '\')">Åbn i CRM</a>');

  return '<div class="pop">'
       + '<div class="pop-navn">' + navn + "</div>"
       + (brand && brand !== navn ? '<div class="pop-brand">' + brand + "</div>" : "")
       + (dele.length ? '<div class="pop-adr">' + dele.join("<br>") + "</div>" : "")
       + '<div class="pop-links">' + links.join(" &middot; ") + "</div>"
       + "</div>";
}

window.aabn = function (id) {
  try { ZOHO.CRM.UI.Record.open({ Entity: CONFIG.modul, RecordID: id }); }
  catch (e) { console.error(e); }
  return false;
};

function tegnMarkers(liste) {
  cluster.clearLayers();
  const pins = [];
  let udenKoordinater = 0;

  liste.forEach(function (r) {
    const la = parseFloat(F(r, "lat"));
    const lo = parseFloat(F(r, "lon"));
    if (isNaN(la) || isNaN(lo)) { udenKoordinater++; return; }
    const m = L.marker([la, lo]);
    m.bindPopup(popupHtml(r));
    pins.push(m);
  });

  cluster.addLayers(pins);

  if (pins.length === 1) {
    kort.setView(pins[0].getLatLng(), 9);
  } else if (pins.length > 1) {
    kort.fitBounds(cluster.getBounds().pad(0.08));
  }

  const bund = $("bund");
  if (udenKoordinater > 0) {
    bund.textContent = udenKoordinater + " afdeling(er) uden koordinater vises ikke på kortet.";
    bund.hidden = false;
  } else {
    bund.hidden = true;
  }
  return { viste: pins.length, uden: udenKoordinater };
}

/* ---------- datahentning ---------- */

function hentSide(side) {
  return ZOHO.CRM.API.getAllRecords({
    Entity: CONFIG.modul, sort_order: "asc", per_page: 200, page: side
  });
}

async function hentAlle() {
  let side = 1;
  let ud = [];
  while (side <= 25) {                       // sikkerhedsloft: 5.000 records
    const svar = await hentSide(side);
    const data = (svar && svar.data) ? svar.data : [];
    ud = ud.concat(data);
    if (data.length < 200) break;
    side++;
  }
  return ud;
}

/* ---------- medlemstilstand ---------- */

function findBrands() {
  const fundet = new Set();

  // 1) Brands fra afdelinger, der er koblet direkte til denne konto
  alleRecords.forEach(function (r) {
    const m = F(r, "medlem");
    if (m && String(m.id) === String(tilstand.kontoId)) {
      const b = F(r, "brand");
      if (b) fundet.add(b);
    }
  });

  // 2) Ellers: brands hvis navn indgår i kontonavnet
  //    (så søsterkonti som "Everllence - PrimeServ Holeby" også viser koncernkortet)
  if (fundet.size === 0 && tilstand.kontoNavn) {
    const kontoLower = tilstand.kontoNavn.toLowerCase();
    const alleBrands = new Set(
      alleRecords.map(function (r) { return F(r, "brand"); }).filter(Boolean)
    );
    alleBrands.forEach(function (b) {
      if (b.length >= CONFIG.minBrandLaengde && kontoLower.indexOf(b.toLowerCase()) !== -1) {
        fundet.add(b);
      }
    });
  }
  return Array.from(fundet);
}

function startMedlemstilstand() {
  tilstand.brands = findBrands();
  let liste;

  if (tilstand.brands.length > 0) {
    liste = alleRecords.filter(function (r) {
      return tilstand.brands.indexOf(F(r, "brand")) !== -1;
    });
  } else {
    liste = alleRecords.filter(function (r) {
      const m = F(r, "medlem");
      return m && String(m.id) === String(tilstand.kontoId);
    });
  }

  if (liste.length === 0) {
    visBesked("Der er endnu ikke registreret afdelinger for dette medlem. " +
              "Tilføj dem via den relaterede liste \u201EAfdelinger\u201C på kontoen.");
    return;
  }

  const res = tegnMarkers(liste);
  const bund = $("bund");
  const navnetekst = tilstand.brands.length ? tilstand.brands.join(", ") : tilstand.kontoNavn;
  bund.textContent = "Viser " + res.viste + " lokation(er) for " + navnetekst
                   + (res.uden ? " \u00b7 " + res.uden + " uden koordinater vises ikke" : "");
  bund.hidden = false;
}

/* ---------- global tilstand med filtre ---------- */

function udfyldFiltre() {
  const lande = Array.from(new Set(
    alleRecords.map(function (r) { return F(r, "land"); }).filter(Boolean)
  )).sort(function (a, b) { return a.localeCompare(b, "da"); });

  const brands = Array.from(new Set(
    alleRecords.map(function (r) { return F(r, "brand"); }).filter(Boolean)
  )).sort(function (a, b) { return a.localeCompare(b, "da"); });

  lande.forEach(function (l) {
    const o = document.createElement("option");
    o.value = l; o.textContent = l;
    $("fLand").appendChild(o);
  });
  brands.forEach(function (b) {
    const o = document.createElement("option");
    o.value = b; o.textContent = b;
    $("fBrand").appendChild(o);
  });
}

function anvendFilter() {
  const land  = $("fLand").value;
  const brand = $("fBrand").value;
  const soeg  = $("fSoeg").value.trim().toLowerCase();

  const liste = alleRecords.filter(function (r) {
    if (land && F(r, "land") !== land) return false;
    if (brand && F(r, "brand") !== brand) return false;
    if (soeg) {
      const tekst = [F(r, "navn"), F(r, "by"), F(r, "adresse"), F(r, "brand"), F(r, "land")]
        .filter(Boolean).join(" ").toLowerCase();
      if (tekst.indexOf(soeg) === -1) return false;
    }
    return true;
  });

  const res = tegnMarkers(liste);
  $("taeller").textContent = res.viste + " af " + alleRecords.length + " afdelinger";
}

function startGlobalTilstand() {
  $("filterbar").hidden = false;
  udfyldFiltre();
  $("fLand").addEventListener("change", anvendFilter);
  $("fBrand").addEventListener("change", anvendFilter);
  $("fSoeg").addEventListener("input", anvendFilter);
  $("fNulstil").addEventListener("click", function () {
    $("fLand").value = ""; $("fBrand").value = ""; $("fSoeg").value = "";
    anvendFilter();
  });
  anvendFilter();
}

/* ---------- opstart ---------- */

async function vedPageLoad(data) {
  if (startTimeout) { clearTimeout(startTimeout); startTimeout = null; }
  try {
    visBesked("Henter afdelinger …");
    alleRecords = await hentAlle();
    skjulBesked();

    const entitet = data && (data.Entity || data.entity);
    let id = data && (data.EntityId || data.entityId);
    if (Array.isArray(id)) id = id[0];

    if (entitet === "Accounts" && id) {
      tilstand.mode = "medlem";
      tilstand.kontoId = id;
      try {
        const k = await ZOHO.CRM.API.getRecord({ Entity: "Accounts", RecordID: id });
        if (k && k.data && k.data[0]) tilstand.kontoNavn = k.data[0].Account_Name || "";
      } catch (e) { console.warn("Kunne ikke hente kontonavn:", e); }
      startMedlemstilstand();
    } else {
      tilstand.mode = "global";
      startGlobalTilstand();
    }
  } catch (fejl) {
    visFejl(fejl);
  }
}

document.addEventListener("DOMContentLoaded", function () {
  initKort();

  if (!window.ZOHO || !ZOHO.embeddedApp) {
    visBesked("Zoho-SDK'et kunne ikke indlæses. Siden skal åbnes inde fra Zoho CRM.", true);
    return;
  }

  // Hvis PageLoad aldrig affyres, vises en forklaring (fx ved åbning uden for CRM)
  startTimeout = setTimeout(function () {
    visBesked("Denne side skal åbnes inde i Zoho CRM (som relateret liste eller webfane) – " +
              "den virker ikke som selvstændig fil.", true);
  }, 10000);

  ZOHO.embeddedApp.on("PageLoad", vedPageLoad);
  ZOHO.embeddedApp.init();
});
</script>
</body>
</html>
