<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afdelingskort</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column;
         font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
         padding: 8px 10px; border-bottom: 1px solid #e3e3e3; background: #fafafa; }
  .top select, .top input {
         padding: 6px 8px; border: 1px solid #c9c9c9; border-radius: 6px;
         font-size: 13px; background: #fff; }
  .top input[type=text] { min-width: 170px; }
  .top button, .knap { padding: 6px 12px; border: 1px solid #c9c9c9; border-radius: 6px;
         background: #fff; color: #1c1c1c; font-size: 13px; cursor: pointer; }
  .top button:hover, .knap:hover { background: #f0f0f0; }
  .knap-excel { background: #eef4fb; border-color: #bcd3ee; color: #1c1c1c; font-weight: 600; }
  .knap-excel:hover { background: #e0ecf9; }
  #taeller { font-size: 12.5px; color: #555; margin-left: auto; }
  #kort { flex: 1; min-height: 260px; background: #e9edf1; }
  .besked { padding: 14px 16px; font-size: 14px; background: #fff7e6;
            color: #7a4b00; border-bottom: 1px solid #f0dcb4; }
  .besked.fejl { background: #fdecec; color: #8a1f1f; border-color: #f2c4c4; }
  .bund { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
          padding: 6px 10px; font-size: 12px; color: #666;
          border-top: 1px solid #e3e3e3; background: #fafafa; }
  .sig { display: inline-flex; align-items: center; gap: 5px; }
  .sig .prik { width: 12px; height: 12px; border-radius: 50%; display: inline-block;
               border: 1px solid rgba(0,0,0,.25); }
  .prik-blaa { background: #2a81cb; }
  .prik-groen { background: #2e9e4f; }
  .pop { font-size: 13px; line-height: 1.45; max-width: 240px; }
  .pop-navn  { font-weight: 600; margin-bottom: 2px; }
  .pop-brand { color: #666; font-size: 12px; margin-bottom: 4px; }
  .pop-hk { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
            background: #e9f7ec; color: #1c6b2c; border: 1px solid #bfe0c6; margin-bottom: 6px; }
  .pop-adr   { margin-bottom: 6px; }
  .pop-bekraeft { font-size: 12px; color: #1c6b2c; margin-bottom: 6px; }
  .pop-bekraeft.foraeldet { color: #c0392b; font-weight: 600; }
  .pop-links a { color: #1a56a0; text-decoration: none; }
  .pop-links a:hover { text-decoration: underline; }
  .pin { width: 26px; height: 41px; position: relative; }
  .pin svg { width: 26px; height: 41px; display: block;
             filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .pin-label { background: rgba(255,255,255,.92); border: 1px solid #cfd6df;
               border-radius: 5px; padding: 1px 6px; font-size: 11.5px; font-weight: 600;
               color: #222; box-shadow: 0 1px 3px rgba(0,0,0,.18); white-space: nowrap; }
  .pin-label::before { display: none; }
  .leaflet-container:not(.zoomet) .pin-label { display: none; }
  .gruppe-pin { width: 32px; height: 32px; border-radius: 50%; display: flex;
                align-items: center; justify-content: center; cursor: pointer;
                background: #2a81cb; color: #fff; font-size: 13px; font-weight: 700;
                border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,.35); }
  .gruppe-pin:hover { background: #1c6aad; }
  .gruppe-pin.gruppe-hk { background: #2e9e4f; }
  .gruppe-pin.gruppe-hk:hover { background: #26833f; }
  .lande-navn { display: flex; align-items: center; justify-content: center;
                width: 100%; height: 100%; white-space: nowrap;
                font-weight: 700; letter-spacing: .14em;
                text-transform: uppercase; color: rgba(15, 63, 107, .34);
                text-shadow: 0 1px 0 rgba(255,255,255,.65); pointer-events: none; }
  .leaflet-container.naerzoom .lande-navn { display: none; }
  .ms { position: relative; }
  .ms > summary { list-style: none; cursor: pointer; padding: 6px 10px;
         border: 1px solid #c9c9c9; border-radius: 6px; background: #fff; font-size: 13px; user-select: none; }
  .ms > summary::-webkit-details-marker { display: none; }
  .ms > summary::after { content: " ▾"; color: #888; }
  .ms-panel { position: absolute; z-index: 1200; top: 112%; left: 0; background: #fff;
         border: 1px solid #c9c9c9; border-radius: 8px; padding: 8px 10px;
         box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 200px; }
  .ms-panel label { display: flex; align-items: center; gap: 6px; font-size: 13px;
         padding: 3px 0; white-space: nowrap; cursor: pointer; }

  /* ---------- Eksport ---------- */
  #eksportGruppe { display: flex; gap: 8px; align-items: center; }
  .ms-eksport > summary { background: #eef4fb; border-color: #bcd3ee; font-weight: 600; }
  .ms-eksport > summary:hover { background: #e0ecf9; }
  .ms-eksport .ms-panel { min-width: 260px; padding: 6px; }
  .eks-valg { display: block; width: 100%; text-align: left; border: 0; background: #fff;
        padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #1c1c1c; }
  .eks-valg:hover { background: #f0f4fa; }
  .eks-valg strong { display: block; font-size: 13px; font-weight: 600; }
  .eks-valg span { display: block; font-size: 11.5px; color: #666; margin-top: 1px; }
  .eks-valg[disabled] { opacity: .5; cursor: default; }
  /* Skjul filterfelterne når baren kun bruges til eksport (medlemsvisning) */
  .top.kun-eksport > *:not(#eksportGruppe):not(#taeller) { display: none; }
  /* Under opsnapning: kortet står alene øverst i dokumentet, så billedet bliver præcist */
  body.eksporterer { display: block; height: auto; overflow: visible; }
  body.eksporterer #filterbar,
  body.eksporterer #besked,
  body.eksporterer #bund { display: none !important; }
  .eksporterer .leaflet-control-container { display: none !important; }
  .eksporterer .leaflet-popup { display: none !important; }
  #eksportSkaerm { position: fixed; inset: 0; z-index: 100000;
        background: rgba(255,255,255,.94); display: flex; align-items: center;
        justify-content: center; flex-direction: column; gap: 10px;
        font-size: 14px; color: #333; }
  #eksportSkaerm .spin { width: 26px; height: 26px; border: 3px solid #d6e2f0;
        border-top-color: #2a81cb; border-radius: 50%; animation: snurr .8s linear infinite; }
  @keyframes snurr { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="top" id="filterbar" hidden>
  <select id="fLand"><option value="">Alle lande</option></select>
  <select id="fBrand"><option value="">Alle virksomheder</option></select>
  <details class="ms" id="msMedlemstype">
    <summary id="msSummary">Medlemstype: alle</summary>
    <div class="ms-panel" id="msPanel"></div>
  </details>
  <input id="fSoeg" type="text" placeholder="Søg afdeling, by eller adresse …">
  <label style="font-size:12.5px;color:#555;display:flex;align-items:center;gap:5px;">
    <input type="checkbox" id="fForael"> Kun forældede
  </label>
  <button id="fNulstil" type="button">Nulstil</button>
  <div id="eksportGruppe">
    <button id="fExcel" type="button" class="knap knap-excel">⬇ Excel</button>
    <details class="ms ms-eksport" id="msEksport">
      <summary>⬇ Eksportér visning</summary>
      <div class="ms-panel">
        <button class="eks-valg" id="eksPng" type="button">
          <strong>Billede (PNG)</strong>
          <span>Kort med titel og signatur – til PowerPoint og mail</span>
        </button>
        <button class="eks-valg" id="eksPdf" type="button">
          <strong>Rapport (PDF)</strong>
          <span>Kort på side 1 + afdelingsliste bagefter</span>
        </button>
        <button class="eks-valg" id="eksPptx" type="button">
          <strong>PowerPoint (PPTX)</strong>
          <span>Redigerbar slide med kort og nøgletal</span>
        </button>
      </div>
    </details>
  </div>
  <span id="taeller"></span>
</div>
<div class="besked" id="besked" hidden></div>
<div id="kort"></div>
<div class="bund" id="bund" hidden></div>

<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script id="hovedscript">
"use strict";
/* =====================================================================
   KONFIGURATION — skal matche API-navnene i CRM. Ret KUN her.
   ===================================================================== */
const CONFIG = {
  modul: "Afdelinger",
  felter: {
    navn:         "Name",
    medlem:       "Medlem",
    brand:        "Brand",
    land:         "Land",
    adresse:      "Adresse",
    postnr:       "Postnummer",
    by:           "By",
    website:      "Website",
    lat:          "Latitude",
    lon:          "Longitude",
    bekraeftet:   "Sidst_bekraeftet",
    afdelingstype:"Afdelingstype"
  },
  minBrandLaengde: 3,
  bekraeftGraenseDage: 365,
  hovedkontorType: "Dansk hovedkontor",
  labelZoom: 8,
  konto: {
    navnFelt:        "Account_Name",
    medlemstypeFelt: "Medlemstype",
    alleMedlemstyper: ["DI - Ordinær", "Associeret", "Iværksættermedlem", "Støttemedlem"]
  },
  /* --- Kortbaggrund og udsnit ---
     Fliser: OpenStreetMap Standard er gratis og kræver ingen nøgle.
     Vil du have skarpere landegrænser og mere læsbare landenavne, kan du skifte
     til CARTO Voyager. Den kræver en gratis nøgle (ingen konto, 5 mio. fliser/md.,
     erhvervsbrug tilladt) – hentes på https://carto.com/basemaps/apikey/ , og
     nøglen sættes på URL'en efter vejledningen der. Uden nøgle lægger CARTO et
     "API KEY REQUIRED"-vandmærke hen over kortet.
       fliserUrl: "https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=DIN_NOEGLE",
       fliserKredit: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-bidragydere &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'
  */
  kort: {
    fliserUrl:    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    fliserKredit: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-bidragydere',
    fliserMaxZoom: 19,
    visLandenavn:    true,   // stort, dæmpet landenavn når visningen er ét land
    visLandegraense: true,   // omrids af landet (hentes fra CDN første gang)
    graensedata: "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json",
    topojsonLib: "https://cdnjs.cloudflare.com/ajax/libs/topojson-client/3.1.0/topojson-client.min.js",
    enkeltPinZoom: 7,        // zoom når der kun er én afdeling og intet land kan bestemmes
    maksZoom:      9,        // kortet zoomer aldrig tættere på end dette af sig selv
    faaAfdelinger: 20,       // op til så mange afdelinger vises uden klynger og med navn på hver
    samlPx:        26        // pins tættere på hinanden end så mange pixels samles i én gruppe

  },
  /* --- Eksport: ret organisationsnavn og farve her --- */
  eksport: {
    organisation: "Danske Maritime",
    accentfarve:  "#0f3f6b",
    kortBredde:   1400,   // px – kortets størrelse under opsnapning
    kortHoejde:    850,
    skala:           2,   // 2 = dobbelt opløsning (skarpt i print)
    maxTabelRaekker: 400  // sikkerhedsgrænse for tabelbilaget
  },
  cdn: {
    html2canvas: "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
    jspdf:       "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
    pptxgen:     "https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"
  }
};
/* ===================================================================== */

let kort, cluster, fliselag;
let alleRecords = [];
let kontoMap = {};
let synligListe = [];
const tilstand = { mode: "global", kontoId: null, kontoNavn: "", brands: [] };
let startTimeout = null;

function pinSvg(farve) {
  return '<div class="pin"><svg viewBox="0 0 26 41" xmlns="http://www.w3.org/2000/svg">'
    + '<path d="M13 0C5.8 0 0 5.8 0 13c0 9 13 28 13 28s13-19 13-28C26 5.8 20.2 0 13 0z" fill="'
    + farve + '"/>'
    + '<circle cx="13" cy="13" r="5" fill="#ffffff" fill-opacity="0.9"/></svg></div>';
}
const ICON_NORMAL = L.divIcon({ className: "", html: pinSvg("#2a81cb"), iconSize: [26, 41], iconAnchor: [13, 41], popupAnchor: [0, -36] });
const ICON_HK = L.divIcon({ className: "", html: pinSvg("#2e9e4f"), iconSize: [26, 41], iconAnchor: [13, 41], popupAnchor: [0, -36] });

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function F(rec, noegle) { return rec[CONFIG.felter[noegle]]; }
function erHovedkontor(r) {
  const t = F(r, "afdelingstype");
  if (!t) return false;
  return String(t).trim().toLowerCase() === CONFIG.hovedkontorType.trim().toLowerCase();
}
function medlemsNavn(r) {
  const b = F(r, "brand");
  if (b) return b;
  const m = F(r, "medlem");
  if (m && m.id && kontoMap[String(m.id)]) return kontoMap[String(m.id)].navn;
  if (m && m.name) return m.name;
  return F(r, "navn") || "";
}
function visBesked(tekst, erFejl) { const b = $("besked"); b.textContent = tekst; b.classList.toggle("fejl", !!erFejl); b.hidden = false; }
function skjulBesked() { $("besked").hidden = true; }
function visFejl(fejl) {
  console.error("Afdelingskort-fejl:", fejl);
  visBesked("Kortet kunne ikke hente data. Tryk F12, åbn fanen Console, kopiér den røde "
    + "fejltekst og send den i chatten – så finder vi fejlen sammen.", true);
}
function medlemstypeForAfd(r) {
  const m = F(r, "medlem");
  if (!m || !m.id) return null;
  const k = kontoMap[String(m.id)];
  return k ? k.type : null;
}
function toCifre(n) { return (n < 10 ? "0" : "") + n; }
function datoISO(d) { return d.getFullYear() + "-" + toCifre(d.getMonth() + 1) + "-" + toCifre(d.getDate()); }
function idagISO() { return datoISO(new Date()); }
function datoDansk(d) {
  const m = ["januar","februar","marts","april","maj","juni","juli","august","september","oktober","november","december"];
  return d.getDate() + ". " + m[d.getMonth()] + " " + d.getFullYear();
}
function bekraeftStatus(rec) {
  const raa = F(rec, "bekraeftet");
  if (!raa) return { harDato: false, foraeldet: true, tekst: "aldrig bekræftet" };
  const d = new Date(raa);
  if (isNaN(d.getTime())) return { harDato: false, foraeldet: true, tekst: String(raa) };
  const alderDage = (Date.now() - d.getTime()) / 86400000;
  return { harDato: true, foraeldet: alderDage > CONFIG.bekraeftGraenseDage, tekst: datoISO(d) };
}
function initKort() {
  /* zoomSnap 0.25: kortet må lande på kvarte zoomtrin, så et land udfylder
     rammen bedre end de faste hele trin tillader. */
  kort = L.map("kort", { worldCopyJump: true, zoomSnap: 0.25, zoomDelta: 1 }).setView([25, 10], 2);
  fliselag = L.tileLayer(CONFIG.kort.fliserUrl, {
    maxZoom: CONFIG.kort.fliserMaxZoom,
    crossOrigin: "anonymous",           /* nødvendigt for at kunne eksportere kortet som billede */
    attribution: CONFIG.kort.fliserKredit
  }).addTo(kort);
  /* Eget lag mellem fliser og pins til landeomrids og landenavn */
  kort.createPane("landepane");
  kort.getPane("landepane").style.zIndex = "350";
  kort.getPane("landepane").style.pointerEvents = "none";
  benRenderer = L.canvas({ pane: "landepane", padding: 0.5 });
  /* Klynger bruges kun når der er mange afdelinger i visningen. Klik zoomer ind,
     og er man helt inde ved sammenfaldende adresser, folder klyngen sig ud.
     (spiderfyOnEveryZoom hjælper ikke: markercluster zoomer først og folder
     bagefter ud et sted hvor klyngen ikke længere findes.) */
  cluster = L.markerClusterGroup({
    showCoverageOnHover: false, maxClusterRadius: 45, spiderfyOnMaxZoom: true
  });
  kort.addLayer(cluster);
  kort.on("zoomend", function () {
    /* Gruppering afhænger af zoom – byg om og fold sammen igen */
    if (simpelLag && !tvungenUdfold) { udfoldetIndeks = -1; opbygSimpel(); }
    opdaterLabelSynlighed();
  });
  kort.on("click", function () {
    if (simpelLag && udfoldetIndeks !== -1) { udfoldetIndeks = -1; opbygSimpel(); }
  });
  opdaterLabelSynlighed();
}
function opdaterLabelSynlighed() {
  if (!kort) return;
  /* Navnene vises enten når man er zoomet tæt nok på, eller når der er så få
     afdelinger i visningen at de kan stå med navn uanset zoom. */
  const faa = antalViste > 0 && antalViste <= CONFIG.kort.faaAfdelinger;
  const naer = kort.getZoom() >= CONFIG.labelZoom;
  kort.getContainer().classList.toggle("zoomet", faa || naer);
  /* Det store landenavn forsvinder først når man for alvor zoomer ind */
  kort.getContainer().classList.toggle("naerzoom", naer);
}
function popupHtml(r) {
  const navn  = esc(F(r, "navn"));
  const brand = esc(F(r, "brand"));
  const type  = F(r, "afdelingstype");
  const hk = erHovedkontor(r) ? '<div class="pop-hk">🏢 ' + esc(type) + "</div>" : "";
  const dele  = [];
  const adr   = esc(F(r, "adresse"));
  const linje2 = [esc(F(r, "postnr")), esc(F(r, "by"))].filter(Boolean).join(" ");
  const land  = esc(F(r, "land"));
  if (adr) dele.push(adr); if (linje2) dele.push(linje2); if (land) dele.push(land);
  const b = bekraeftStatus(r);
  const bekraeftTekst = b.harDato
    ? ("Sidst bekræftet: " + b.tekst + (b.foraeldet ? " ⚠ (bør tjekkes)" : ""))
    : "⚠ Ikke bekræftet endnu";
  const bekraeftHtml = '<div class="pop-bekraeft' + (b.foraeldet ? " foraeldet" : "") + '">' + esc(bekraeftTekst) + "</div>";
  const links = [];
  const web = F(r, "website");
  if (web) links.push('<a href="' + esc(web) + '" target="_blank" rel="noopener">Hjemmeside</a>');
  links.push('<a href="#" onclick="return aabn(\'' + esc(r.id) + '\')">Åbn i CRM</a>');
  return '<div class="pop">'
       + '<div class="pop-navn">' + navn + "</div>"
       + (brand && brand !== navn ? '<div class="pop-brand">' + brand + "</div>" : "")
       + hk
       + (dele.length ? '<div class="pop-adr">' + dele.join("<br>") + "</div>" : "")
       + bekraeftHtml
       + '<div class="pop-links">' + links.join(" &middot; ") + "</div></div>";
}
window.aabn = function (id) {
  try { ZOHO.CRM.UI.Record.open({ Entity: CONFIG.modul, RecordID: id }); } catch (e) { console.error(e); }
  return false;
};
function koordFor(r) {
  const la = parseFloat(F(r, "lat")), lo = parseFloat(F(r, "lon"));
  return (isNaN(la) || isNaN(lo)) ? null : L.latLng(la, lo);
}
function lavMarkoer(r, ll, tip) {
  const m = L.marker(ll, { icon: erHovedkontor(r) ? ICON_HK : ICON_NORMAL });
  m.bindPopup(popupHtml(r));
  const label = medlemsNavn(r);
  if (label) {
    m.bindTooltip(esc(label), Object.assign({
      permanent: true, direction: "top", offset: [0, -38], className: "pin-label", opacity: 1
    }, tip || {}));
  }
  return m;
}
/* Ved udfoldning lægges navnet ud til den side pin'en peger, så de ikke overlapper */
function tipRetning(vinkel) {
  const cos = Math.cos(vinkel), sin = Math.sin(vinkel);
  if (cos > 0.35)  return { direction: "right", offset: [12, -20] };
  if (cos < -0.35) return { direction: "left",  offset: [-12, -20] };
  if (sin < 0)     return { direction: "top",   offset: [0, -38] };
  return { direction: "bottom", offset: [0, 4] };
}

function tegnMarkers(liste) {
  cluster.clearLayers();
  if (simpelLag) { kort.removeLayer(simpelLag); simpelLag = null; }
  simpelPoster = [];
  grupper = [];
  udfoldetIndeks = -1;

  const medKoord = [];
  let udenKoordinater = 0, antalHK = 0;
  liste.forEach(function (r) {
    if (!koordFor(r)) { udenKoordinater++; return; }
    if (erHovedkontor(r)) antalHK++;
    medKoord.push(r);
  });
  antalViste = medKoord.length;
  pinRamme = medKoord.length ? L.latLngBounds(medKoord.map(koordFor)) : null;

  if (medKoord.length && medKoord.length <= CONFIG.kort.faaAfdelinger) {
    /* Få afdelinger: hver sin pin med navn, og sammenfaldende adresser
       samles i en klikbar gruppe der kan foldes ud. */
    simpelPoster = medKoord;
    simpelLag = L.layerGroup().addTo(kort);
    opbygSimpel();
  } else {
    synligePins = medKoord.map(function (r) { return lavMarkoer(r, koordFor(r)); });
    cluster.addLayers(synligePins);
  }
  opdaterLabelSynlighed();
  return { viste: medKoord.length, uden: udenKoordinater, hk: antalHK };
}

/* =====================================================================
   SAMMENFALDENDE ADRESSER — flere medlemmer i samme by får tit præcis
   samme koordinat, så pins lægger sig oven på hinanden. De samles i én
   gruppe som kan foldes ud med et klik, og som altid foldes ud i eksporten.
   ===================================================================== */
function gruppeIkon(g) {
  const harHK = g.poster.some(erHovedkontor);
  return L.divIcon({
    className: "",
    html: '<div class="gruppe-pin' + (harHK ? " gruppe-hk" : "") + '">' + g.poster.length + "</div>",
    iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -16]
  });
}
function gruppeNavn(g) {
  const brands = [];
  g.poster.forEach(function (r) { const b = medlemsNavn(r); if (b && brands.indexOf(b) === -1) brands.push(b); });
  const by = F(g.poster[0], "by");
  if (brands.length === 1) return brands[0] + " (" + g.poster.length + ")";
  return (by ? by + ": " : "") + g.poster.length + " afdelinger";
}
function byggGrupper(poster) {
  const z = kort.getZoom(), ud = [];
  poster.forEach(function (r) {
    const ll = koordFor(r), p = kort.project(ll, z);
    let fundet = null;
    for (let i = 0; i < ud.length; i++) {
      if (p.distanceTo(ud[i].p) <= CONFIG.kort.samlPx) { fundet = ud[i]; break; }
    }
    if (fundet) fundet.poster.push(r);
    else ud.push({ p: p, ll: ll, poster: [r] });
  });
  return ud;
}
function opbygSimpel() {
  if (!simpelLag) return;
  /* Luk de faste labels før laget ryddes, så ingen bliver hængende på kortet */
  simpelLag.eachLayer(function (l) { if (l.closeTooltip) l.closeTooltip(); });
  simpelLag.clearLayers();
  synligePins = [];
  grupper = byggGrupper(simpelPoster);
  const z = kort.getZoom();
  grupper.forEach(function (g, i) {
    if (g.poster.length === 1) {
      const m = lavMarkoer(g.poster[0], g.ll);
      synligePins.push(m); simpelLag.addLayer(m);
      return;
    }
    if (tvungenUdfold || udfoldetIndeks === i) {
      const n = g.poster.length, radius = Math.max(46, 15 * n);
      g.poster.forEach(function (r, k) {
        const v = (2 * Math.PI * k) / n - Math.PI / 2;
        const ll2 = kort.unproject(L.point(g.p.x + radius * Math.cos(v), g.p.y + radius * Math.sin(v)), z);
        simpelLag.addLayer(L.polyline([g.ll, ll2], {
          pane: "landepane", renderer: benRenderer, interactive: false,
          color: "#5b6b7d", weight: 1, opacity: .6
        }));
        const m = lavMarkoer(r, ll2, tipRetning(v));
        synligePins.push(m); simpelLag.addLayer(m);
      });
    } else {
      const m = L.marker(g.ll, { icon: gruppeIkon(g), title: "Klik for at folde de " + g.poster.length + " afdelinger ud" });
      m.bindTooltip(esc(gruppeNavn(g)), { permanent: true, direction: "top", offset: [0, -20], className: "pin-label", opacity: 1 });
      m.on("click", function (e) {
        L.DomEvent.stopPropagation(e);
        udfoldetIndeks = (udfoldetIndeks === i) ? -1 : i;
        opbygSimpel();
      });
      synligePins.push(m); simpelLag.addLayer(m);
    }
  });
  opdaterLabelSynlighed();
}

/* =====================================================================
   UDSNIT — når visningen kun rummer ét land, rammes hele landet ind
   i stedet for kun de kontorer der ligger der. Ellers ville ét kontor
   i Nigeria give et gadekort over Lagos.
   ===================================================================== */
let udsnitOpgave = Promise.resolve();
let landeLag = null;          /* omrids + landenavn */
let simpelLag = null;         /* pins uden klynger, når der er få af dem */
let simpelPoster = [];        /* de records der vises i den tilstand */
let grupper = [];             /* sammenfaldende adresser */
let udfoldetIndeks = -1;      /* hvilken gruppe brugeren har foldet ud */
let tvungenUdfold = false;    /* alle grupper foldet ud (bruges ved eksport) */
let benRenderer = null;       /* canvas til stregerne ud til de udfoldede pins */
let synligePins = [];         /* markørerne i den aktuelle visning */
let antalViste = 0;           /* antal afdelinger med koordinater i visningen */
let pinRamme = null;          /* L.latLngBounds omkring dem */
let landeRamme = null;        /* L.latLngBounds for landet, hvis kendt */
let verdensdata = null;       /* cache af grænsedata */

function landeIkon(navn, str) {
  const b = 600, h = Math.round(str * 2);
  return L.divIcon({
    className: "",
    html: '<div class="lande-navn" style="font-size:' + str + 'px">' + esc(navn) + "</div>",
    iconSize: [b, h], iconAnchor: [b / 2, h / 2]
  });
}
async function hentLandegraense(nummer) {
  await indlaesScript(CONFIG.kort.topojsonLib);
  if (!verdensdata) {
    const svar = await fetch(CONFIG.kort.graensedata);
    if (!svar.ok) throw new Error("Grænsedata svarede " + svar.status);
    verdensdata = await svar.json();
  }
  const samling = window.topojson.feature(verdensdata, verdensdata.objects.countries);
  const tal = parseInt(nummer, 10);
  const fundet = samling.features.filter(function (f) { return parseInt(f.id, 10) === tal; });
  if (!fundet.length) throw new Error("Landet findes ikke i grænsedataene: " + nummer);
  return { type: "FeatureCollection", features: fundet };
}

/* Opdaterer landelaget og tilpasser udsnittet. Kaldes efter hver filtrering. */
async function opdaterUdsnit(liste) {
  if (landeLag) { kort.removeLayer(landeLag); landeLag = null; }
  landeRamme = null;
  const lande = landeIVisning(liste);
  if (lande.length === 1) {
    const d = findLand(lande[0]);
    if (d) {
      landeLag = L.layerGroup().addTo(kort);
      landeRamme = L.latLngBounds([d.bb[1], d.bb[0]], [d.bb[3], d.bb[2]]);
      if (CONFIG.kort.visLandenavn) {
        L.marker([d.c[1], d.c[0]], {
          icon: landeIkon(lande[0], 30), interactive: false, keyboard: false, pane: "landepane"
        }).addTo(landeLag);
      }
      tilpasUdsnit();
      if (CONFIG.kort.visLandegraense) {
        try {
          const gj = await hentLandegraense(d.nummer);
          if (!landeLag) return;                       /* filteret er skiftet imens */
          const omrids = L.geoJSON(gj, {
            pane: "landepane", interactive: false,
            /* Canvas i stedet for SVG: html2canvas kan kopiere et canvas, men
               gengiver ikke Leaflets SVG-lag korrekt i eksportbilledet.
               Samme canvas genbruges, så der ikke hobes lag op ved landeskift. */
            renderer: benRenderer,
            style: { color: CONFIG.eksport.accentfarve, weight: 1.6, opacity: .55,
                     fillColor: CONFIG.eksport.accentfarve, fillOpacity: .06 }
          }).addTo(landeLag);
          landeRamme = omrids.getBounds();
        } catch (e) { console.warn("Landeomrids kunne ikke hentes:", e); }
      }
    } else {
      console.info("Ukendt landenavn – kortet rammes ind efter kontorerne i stedet:", lande[0]);
    }
  }
  tilpasUdsnit();
}

function tilpasUdsnit() {
  let ramme = null;
  if (landeRamme) ramme = L.latLngBounds(landeRamme.getSouthWest(), landeRamme.getNorthEast());
  if (pinRamme) {
    const pb = L.latLngBounds(pinRamme.getSouthWest(), pinRamme.getNorthEast());
    ramme = ramme ? ramme.extend(pb) : pb;
  }
  if (!ramme || !ramme.isValid()) return;
  if (ramme.getNorth() === ramme.getSouth() && ramme.getEast() === ramme.getWest()) {
    kort.setView(ramme.getCenter(), CONFIG.kort.enkeltPinZoom, { animate: false });
  } else {
    kort.fitBounds(ramme.pad(0.08), { maxZoom: CONFIG.kort.maksZoom, animate: false });
  }
  opdaterLabelSynlighed();
}
function opdaterBund(res, ekstraTekst) {
  const bund = $("bund");
  let html = '<span class="sig"><span class="prik prik-blaa"></span>Afdeling</span>'
           + '<span class="sig"><span class="prik prik-groen"></span>🏢 Dansk hovedkontor</span>';
  if (ekstraTekst) html += "<span>" + esc(ekstraTekst) + "</span>";
  if (res && res.uden > 0) html += "<span>" + res.uden + " uden koordinater vises ikke</span>";
  bund.innerHTML = html;
  bund.hidden = false;
}

let landeIndeks = null;
function normLand(s) {
  return String(s == null ? "" : s).toLowerCase()
    .replace(/\u00e6/g, "ae").replace(/\u00f8/g, "oe").replace(/\u00e5/g, "aa")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]/g, "");
}
function byggLandeIndeks() {
  landeIndeks = {};
  LANDE.forEach(function (linje) {
    const d = linje.split("|");
    const post = {
      iso2: d[0], nummer: d[1],
      bb: d[3].split(",").map(Number),
      c:  d[4].split(",").map(Number)
    };
    d[2].split(";").forEach(function (n) { if (n && !landeIndeks[n]) landeIndeks[n] = post; });
  });
}
function findLand(navn) {
  if (!landeIndeks) byggLandeIndeks();
  return landeIndeks[normLand(navn)] || null;
}
function landeIVisning(liste) {
  const s = {};
  liste.forEach(function (r) { const l = F(r, "land"); if (l) s[l] = true; });
  return Object.keys(s);
}

/* Henter et bibliotek første gang det bruges (holder widget'en let). */
const indlaesteScripts = {};
function indlaesScript(url) {
  if (indlaesteScripts[url]) return indlaesteScripts[url];
  indlaesteScripts[url] = new Promise(function (ok, fejl) {
    const s = document.createElement("script");
    s.src = url; s.async = true;
    s.onload = function () { ok(); };
    s.onerror = function () { indlaesteScripts[url] = null; fejl(new Error("Kunne ikke hente " + url)); };
    document.head.appendChild(s);
  });
  return indlaesteScripts[url];
}

function visEksportSkaerm(tekst) {
  let el = $("eksportSkaerm");
  if (!el) {
    el = document.createElement("div");
    el.id = "eksportSkaerm";
    el.innerHTML = '<div class="spin"></div><div id="eksportSkaermTekst"></div>';
    document.body.appendChild(el);
  }
  el.style.display = "flex";
  $("eksportSkaermTekst").textContent = tekst || "Forbereder eksport …";
}
function skjulEksportSkaerm() { const el = $("eksportSkaerm"); if (el) el.style.display = "none"; }

/* Beskriver hvilket filter brugeren står på lige nu. */
function eksportOverskrift() {
  const dato = new Date();
  const antal = synligListe.length;
  let antalHK = 0, udenKoord = 0;
  synligListe.forEach(function (r) {
    if (erHovedkontor(r)) antalHK++;
    if (isNaN(parseFloat(F(r, "lat"))) || isNaN(parseFloat(F(r, "lon")))) udenKoord++;
  });
  const lande = Array.from(new Set(synligListe.map(function (r) { return F(r, "land"); }).filter(Boolean)));

  let titel, filnavnDel;
  const filtre = [];

  if (tilstand.mode === "medlem") {
    const navn = tilstand.brands.length ? tilstand.brands.join(", ") : (tilstand.kontoNavn || "medlem");
    titel = "Afdelinger – " + navn;
    filnavnDel = navn;
  } else {
    const land  = $("fLand") ? $("fLand").value : "";
    const brand = $("fBrand") ? $("fBrand").value : "";
    const soeg  = $("fSoeg") ? $("fSoeg").value.trim() : "";
    const kunForael = $("fForael") ? $("fForael").checked : false;
    const mtyper = valgteMedlemstyper();
    const alleMt = mtyper.length === CONFIG.konto.alleMedlemstyper.length;

    if (land && brand) titel = "Afdelingskort – " + brand + " i " + land;
    else if (land)     titel = "Afdelingskort – " + land;
    else if (brand)    titel = "Afdelingskort – " + brand;
    else               titel = "Afdelingskort – alle lande";
    filnavnDel = land || brand || "alle";

    if (land)  filtre.push("Land: " + land);
    if (brand) filtre.push("Virksomhed: " + brand);
    if (!alleMt) filtre.push("Medlemstype: " + mtyper.join(", "));
    if (kunForael) filtre.push("Kun forældede oplysninger");
    if (soeg) filtre.push("Søgning: ‚" + soeg + "’");
  }

  const noegletal = [];
  noegletal.push(antal + (antal === 1 ? " afdeling" : " afdelinger"));
  if (antalHK) noegletal.push(antalHK + (antalHK === 1 ? " dansk hovedkontor" : " danske hovedkontorer"));
  if (!$("fLand") || !$("fLand").value) noegletal.push(lande.length + (lande.length === 1 ? " land" : " lande"));

  const undertitel = noegletal.join(" · ") + (filtre.length ? "   |   " + filtre.join(" · ") : "");

  return {
    titel: titel,
    undertitel: undertitel,
    filtre: filtre,
    noegletal: noegletal,
    antal: antal, antalHK: antalHK, lande: lande, udenKoord: udenKoord,
    dato: dato,
    datoTekst: datoDansk(dato),
    filnavn: "afdelingskort_" + slug(filnavnDel) + "_" + idagISO()
  };
}
function slug(s) {
  return String(s || "kort").toLowerCase()
    .replace(/æ/g, "ae").replace(/ø/g, "oe").replace(/å/g, "aa")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "kort";
}

/* Undgår grå bjælke over/under verdenskortet når udsnittet er højere end kortdataene. */
function klemLodret() {
  const z = kort.getZoom(), st = kort.getSize();
  const nord = kort.project(L.latLng(85.0511, 0), z).y;
  const syd  = kort.project(L.latLng(-85.0511, 0), z).y;
  if (syd - nord <= st.y) return;
  const c = kort.project(kort.getCenter(), z);
  const min = nord + st.y / 2, max = syd - st.y / 2;
  const y = Math.min(Math.max(c.y, min), max);
  if (Math.abs(y - c.y) > 0.5) kort.setView(kort.unproject(L.point(c.x, y), z), z, { animate: false });
}

/* Venter til alle kortfliser er hentet, så billedet ikke bliver gråt. */
function ventPaaFliser(maxMs) {
  return new Promise(function (ok) {
    let faerdig = false;
    const afslut = function () { if (faerdig) return; faerdig = true; setTimeout(ok, 300); };
    const t = setTimeout(function () { faerdig = true; ok(); }, maxMs || 9000);
    const naar = function () { clearTimeout(t); afslut(); };
    if (!fliselag || !fliselag._loading) { clearTimeout(t); afslut(); return; }
    fliselag.once("load", naar);
  });
}

/* Sætter kortet op i fast eksportstørrelse, tager billedet, og stiller alt tilbage. */
async function opsnapKort() {
  await indlaesScript(CONFIG.cdn.html2canvas);
  const el = $("kort");
  const B = CONFIG.eksport.kortBredde, H = CONFIG.eksport.kortHoejde;
  const gemt = {
    cssText: el.style.cssText,
    center: kort.getCenter(),
    zoom: kort.getZoom()
  };
  kort.closePopup();
  const gemtScroll = { x: window.scrollX, y: window.scrollY };
  document.body.classList.add("eksporterer");
  el.style.cssText = "position:relative;flex:none;width:" + B + "px;height:" + H + "px;margin:0;";
  window.scrollTo(0, 0);
  try {
    await udsnitOpgave;                 /* evt. landeomrids skal være på plads først */
    tvungenUdfold = true;               /* alle sammenfaldende adresser skal med på billedet */
    kort.invalidateSize({ animate: false });
    tilpasUdsnit();
    klemLodret();
    opbygSimpel();
    opdaterLabelSynlighed();
    await ventPaaFliser();
    const canvas = await window.html2canvas(el, {
      backgroundColor: "#ffffff",
      useCORS: true,
      logging: false,
      scale: CONFIG.eksport.skala,
      width: B, height: H,
      windowWidth: B, windowHeight: H,
      scrollX: 0, scrollY: 0
    });
    return canvas;
  } finally {
    tvungenUdfold = false;
    el.style.cssText = gemt.cssText;
    document.body.classList.remove("eksporterer");
    window.scrollTo(gemtScroll.x, gemtScroll.y);
    kort.invalidateSize({ animate: false });
    kort.setView(gemt.center, gemt.zoom, { animate: false });
    opbygSimpel();
    opdaterLabelSynlighed();
  }
}

/* Tegner titelbjælke, signaturforklaring og kildeangivelse omkring kortbilledet. */
function indramKort(kortCanvas, info) {
  const s = CONFIG.eksport.skala;
  const topH = 78 * s, bundH = 44 * s, kant = 1 * s;
  const c = document.createElement("canvas");
  c.width = kortCanvas.width + kant * 2;
  c.height = kortCanvas.height + topH + bundH + kant * 2;
  const g = c.getContext("2d");

  g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height);

  /* Titelbjælke */
  g.fillStyle = CONFIG.eksport.accentfarve;
  g.fillRect(0, 0, c.width, topH);
  g.fillStyle = "#ffffff";
  g.font = "600 " + (23 * s) + "px -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";
  g.textBaseline = "alphabetic";
  g.fillText(info.titel, 20 * s, 33 * s);
  g.fillStyle = "rgba(255,255,255,.82)";
  g.font = (13 * s) + "px -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";
  g.fillText(info.undertitel, 20 * s, 55 * s);
  g.font = "600 " + (13 * s) + "px -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";
  g.textAlign = "right";
  g.fillStyle = "rgba(255,255,255,.92)";
  g.fillText(CONFIG.eksport.organisation, c.width - 20 * s, 33 * s);
  g.font = (12 * s) + "px -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";
  g.fillStyle = "rgba(255,255,255,.75)";
  g.fillText(info.datoTekst, c.width - 20 * s, 53 * s);
  g.textAlign = "left";

  /* Kortbilledet */
  g.drawImage(kortCanvas, kant, topH + kant);
  g.strokeStyle = "#d8dee6"; g.lineWidth = kant;
  g.strokeRect(kant / 2, topH + kant / 2, c.width - kant, kortCanvas.height + kant);

  /* Bundbjælke med signaturforklaring */
  const by = topH + kortCanvas.height + kant * 2;
  g.fillStyle = "#f7f9fb"; g.fillRect(0, by, c.width, bundH);
  g.strokeStyle = "#e3e7ec"; g.lineWidth = kant;
  g.beginPath(); g.moveTo(0, by + kant / 2); g.lineTo(c.width, by + kant / 2); g.stroke();

  let x = 20 * s;
  const midt = by + bundH / 2;
  const prik = function (farve, tekst) {
    g.beginPath(); g.arc(x + 6 * s, midt, 6 * s, 0, Math.PI * 2);
    g.fillStyle = farve; g.fill();
    g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 1 * s; g.stroke();
    x += 18 * s;
    g.fillStyle = "#444";
    g.font = (13 * s) + "px -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";
    g.textBaseline = "middle";
    g.fillText(tekst, x, midt);
    x += g.measureText(tekst).width + 26 * s;
  };
  prik("#2a81cb", "Afdeling");
  prik("#2e9e4f", "Dansk hovedkontor");
  if (info.udenKoord > 0) {
    g.fillStyle = "#8a6d1f";
    g.fillText(info.udenKoord + " uden koordinater vises ikke", x, midt);
  }
  g.textAlign = "right";
  g.fillStyle = "#777";
  g.font = (11.5 * s) + "px -apple-system, 'Segoe UI', Roboto, Arial, sans-serif";
  g.fillText("Kilde: " + CONFIG.eksport.organisation + "s CRM · Kortdata © OpenStreetMap-bidragydere",
             c.width - 20 * s, midt);
  g.textAlign = "left"; g.textBaseline = "alphabetic";
  return c;
}

function hentTabeldata() {
  const kol = ["Afdeling", "Virksomhed", "Type", "Land", "By", "Adresse", "Sidst bekræftet"];
  const raekker = synligListe.slice(0, CONFIG.eksport.maxTabelRaekker).map(function (r) {
    const b = bekraeftStatus(r);
    return [
      F(r, "navn") || "",
      F(r, "brand") || medlemsNavn(r) || "",
      erHovedkontor(r) ? "Hovedkontor" : (F(r, "afdelingstype") || "Afdeling"),
      F(r, "land") || "",
      [F(r, "postnr"), F(r, "by")].filter(Boolean).join(" "),
      F(r, "adresse") || "",
      b.harDato ? b.tekst : "—"
    ];
  });
  return { kolonner: kol, raekker: raekker, afkortet: synligListe.length > CONFIG.eksport.maxTabelRaekker };
}

function gemBlob(blob, filnavn) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filnavn;
  document.body.appendChild(a); a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
}

function tjekVisning() {
  if (!synligListe || synligListe.length === 0) {
    visBesked("Der er ingen afdelinger at eksportere i den aktuelle visning.", true);
    return false;
  }
  const medKoord = synligListe.filter(function (r) {
    return !isNaN(parseFloat(F(r, "lat"))) && !isNaN(parseFloat(F(r, "lon")));
  });
  if (medKoord.length === 0) {
    visBesked("Ingen af afdelingerne i visningen har koordinater, så kortet kan ikke eksporteres.", true);
    return false;
  }
  return true;
}

async function eksporterPng() {
  if (!tjekVisning()) return;
  visEksportSkaerm("Tegner kortet …");
  try {
    const info = eksportOverskrift();
    const kortC = await opsnapKort();
    const helC = indramKort(kortC, info);
    await new Promise(function (ok) {
      helC.toBlob(function (blob) { gemBlob(blob, info.filnavn + ".png"); ok(); }, "image/png");
    });
    skjulBesked();
  } catch (e) { eksportFejl(e); } finally { skjulEksportSkaerm(); }
}

async function eksporterPdf() {
  if (!tjekVisning()) return;
  visEksportSkaerm("Bygger PDF …");
  try {
    const info = eksportOverskrift();
    await indlaesScript(CONFIG.cdn.jspdf);
    const kortC = await opsnapKort();
    const jsPDFklasse = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
    const doc = new jsPDFklasse({ orientation: "landscape", unit: "mm", format: "a4" });
    const S = { b: 297, h: 210, m: 12 };
    const accent = CONFIG.eksport.accentfarve;

    /* --- Side 1: kortet --- */
    doc.setFillColor(accent);
    doc.rect(0, 0, S.b, 22, "F");
    doc.setTextColor("#ffffff");
    doc.setFont("helvetica", "bold"); doc.setFontSize(15);
    doc.text(info.titel, S.m, 10.5);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9);
    doc.setTextColor("#dbe6f0");
    doc.text(info.undertitel, S.m, 17);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10);
    doc.setTextColor("#ffffff");
    doc.text(CONFIG.eksport.organisation, S.b - S.m, 10.5, { align: "right" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
    doc.setTextColor("#dbe6f0");
    doc.text(info.datoTekst, S.b - S.m, 16.5, { align: "right" });

    const omraadeB = S.b - S.m * 2;
    const omraadeH = S.h - 22 - 8 - 16;
    const skala = Math.min(omraadeB / kortC.width, omraadeH / kortC.height);
    const bB = kortC.width * skala, bH = kortC.height * skala;
    const bX = (S.b - bB) / 2, bY = 22 + 6 + Math.max(0, (omraadeH - bH) / 2);
    doc.addImage(kortC.toDataURL("image/jpeg", 0.92), "JPEG", bX, bY, bB, bH);
    doc.setDrawColor("#d8dee6"); doc.setLineWidth(0.3);
    doc.rect(bX, bY, bB, bH);

    /* Signatur + kilde */
    let ly = bY + bH + 7;
    doc.setFillColor("#2a81cb"); doc.circle(S.m + 1.6, ly - 1.2, 1.6, "F");
    doc.setFillColor("#2e9e4f"); doc.circle(S.m + 32, ly - 1.2, 1.6, "F");
    doc.setFontSize(8.5); doc.setTextColor("#444");
    doc.text("Afdeling", S.m + 4.6, ly);
    doc.text("Dansk hovedkontor", S.m + 35, ly);
    if (info.udenKoord > 0) {
      doc.setTextColor("#8a6d1f");
      doc.text(info.udenKoord + " uden koordinater vises ikke på kortet", S.m + 78, ly);
    }
    doc.setTextColor("#8a8a8a"); doc.setFontSize(7.5);
    doc.text("Kilde: " + CONFIG.eksport.organisation + "s CRM · Kortdata © OpenStreetMap-bidragydere",
             S.b - S.m, ly, { align: "right" });

    /* --- Følgende sider: afdelingsliste --- */
    const tab = hentTabeldata();
    const bredder = [52, 46, 30, 32, 40, 55, 18];
    tegnTabel(doc, tab, bredder, info, S, accent);

    /* Sidetal */
    const sider = doc.getNumberOfPages();
    for (let i = 1; i <= sider; i++) {
      doc.setPage(i);
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor("#9a9a9a");
      doc.text("Side " + i + " af " + sider, S.b / 2, S.h - 5, { align: "center" });
    }

    doc.save(info.filnavn + ".pdf");
    skjulBesked();
  } catch (e) { eksportFejl(e); } finally { skjulEksportSkaerm(); }
}

/* Enkel, sidebrydende tabel — ingen ekstra bibliotek nødvendig. */
function tegnTabel(doc, tab, bredder, info, S, accent) {
  const linjeH = 4.2, pad = 1.6;
  let y = 0;

  const tegnSidehoved = function (nr) {
    doc.addPage();
    doc.setFillColor(accent); doc.rect(0, 0, S.b, 14, "F");
    doc.setTextColor("#ffffff"); doc.setFont("helvetica", "bold"); doc.setFontSize(10);
    doc.text(info.titel + " – afdelingsliste", S.m, 9);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8);
    doc.setTextColor("#dbe6f0");
    doc.text(CONFIG.eksport.organisation + " · " + info.datoTekst, S.b - S.m, 9, { align: "right" });
    y = 22;
    tegnHovedraekke();
  };
  const tegnHovedraekke = function () {
    doc.setFillColor("#eef4fb"); doc.rect(S.m, y - 4.6, S.b - S.m * 2, 6.4, "F");
    doc.setTextColor("#1c3d5c"); doc.setFont("helvetica", "bold"); doc.setFontSize(8);
    let x = S.m + pad;
    tab.kolonner.forEach(function (k, i) { doc.text(k, x, y); x += bredder[i]; });
    doc.setDrawColor("#bcd3ee"); doc.setLineWidth(0.2);
    doc.line(S.m, y + 1.9, S.b - S.m, y + 1.9);
    y += 6;
    doc.setFont("helvetica", "normal"); doc.setTextColor("#222");
  };

  tegnSidehoved();
  doc.setFontSize(8);

  tab.raekker.forEach(function (raekke, idx) {
    const celler = raekke.map(function (v, i) {
      return doc.splitTextToSize(String(v == null ? "" : v), bredder[i] - pad * 2);
    });
    const linjer = celler.reduce(function (m, c) { return Math.max(m, c.length); }, 1);
    const h = linjer * linjeH + 1.4;
    if (y + h > S.h - 12) { tegnSidehoved(); doc.setFontSize(8); }
    if (idx % 2 === 1) { doc.setFillColor("#f7f9fb"); doc.rect(S.m, y - 3.2, S.b - S.m * 2, h, "F"); }
    let x = S.m + pad;
    celler.forEach(function (c, i) { doc.text(c, x, y); x += bredder[i]; });
    y += h;
  });

  if (tab.afkortet) {
    doc.setTextColor("#8a6d1f"); doc.setFontSize(8);
    doc.text("Listen er afkortet til " + CONFIG.eksport.maxTabelRaekker
      + " rækker. Brug Excel-eksporten for den fulde liste.", S.m, y + 4);
  }
}

async function eksporterPptx() {
  if (!tjekVisning()) return;
  visEksportSkaerm("Bygger PowerPoint …");
  try {
    const info = eksportOverskrift();
    await indlaesScript(CONFIG.cdn.pptxgen);
    const kortC = await opsnapKort();
    const pptx = new window.PptxGenJS();
    pptx.layout = "LAYOUT_16x9";           /* 10 x 5,625 tommer */
    pptx.author = CONFIG.eksport.organisation;
    pptx.title = info.titel;
    const s = pptx.addSlide();

    s.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: 10, h: 0.82, fill: { color: CONFIG.eksport.accentfarve.replace("#", "") } });
    s.addText(info.titel, { x: 0.35, y: 0.08, w: 6.6, h: 0.4, fontSize: 20, bold: true, color: "FFFFFF" });
    s.addText(info.undertitel, { x: 0.35, y: 0.47, w: 6.6, h: 0.3, fontSize: 10, color: "DBE6F0" });
    s.addText(CONFIG.eksport.organisation + "\n" + info.datoTekst,
      { x: 7.1, y: 0.1, w: 2.55, h: 0.6, fontSize: 10, align: "right", color: "FFFFFF" });

    const maxB = 9.3, maxH = 4.1;
    const forhold = kortC.width / kortC.height;
    let bB = maxB, bH = maxB / forhold;
    if (bH > maxH) { bH = maxH; bB = maxH * forhold; }
    s.addImage({ data: kortC.toDataURL("image/png"), x: (10 - bB) / 2, y: 1.0, w: bB, h: bH });

    const sigY = 1.0 + bH + 0.1;
    s.addShape(pptx.ShapeType.ellipse, { x: 0.35, y: sigY + 0.05, w: 0.11, h: 0.11, fill: { color: "2A81CB" } });
    s.addText("Afdeling", { x: 0.5, y: sigY, w: 1.2, h: 0.22, fontSize: 9, color: "444444" });
    s.addShape(pptx.ShapeType.ellipse, { x: 1.5, y: sigY + 0.05, w: 0.11, h: 0.11, fill: { color: "2E9E4F" } });
    s.addText("Dansk hovedkontor", { x: 1.65, y: sigY, w: 2, h: 0.22, fontSize: 9, color: "444444" });
    s.addText("Kilde: " + CONFIG.eksport.organisation + "s CRM · Kortdata © OpenStreetMap-bidragydere",
      { x: 5.8, y: sigY, w: 3.85, h: 0.22, fontSize: 8, align: "right", color: "888888" });

    /* Slide 2+: afdelingsliste som rigtig PowerPoint-tabel */
    const tab = hentTabeldata();
    if (tab.raekker.length) {
      const s2 = pptx.addSlide();
      s2.addText(info.titel + " – afdelingsliste",
        { x: 0.35, y: 0.25, w: 9.3, h: 0.4, fontSize: 16, bold: true, color: CONFIG.eksport.accentfarve.replace("#", "") });
      const raekker = [tab.kolonner.map(function (k) {
        return { text: k, options: { bold: true, color: "1C3D5C", fill: { color: "EEF4FB" } } };
      })].concat(tab.raekker.map(function (r) { return r.map(function (v) { return String(v); }); }));
      s2.addTable(raekker, {
        x: 0.35, y: 0.8, w: 9.3, colW: [1.9, 1.55, 1.0, 1.0, 1.3, 1.6, 0.95],
        fontSize: 8, border: { type: "solid", color: "DDE3EA", pt: 0.5 },
        autoPage: true, autoPageRepeatHeader: true, autoPageLineWeight: -0.4,
        newSlideStartY: 0.5
      });
    }

    const blob = await pptx.write({ outputType: "blob" });
    gemBlob(blob, info.filnavn + ".pptx");
    skjulBesked();
  } catch (e) { eksportFejl(e); } finally { skjulEksportSkaerm(); }
}

function eksportFejl(e) {
  console.error("Eksportfejl:", e);
  const tekst = String((e && e.message) || e);
  if (/tainted|SecurityError|insecure/i.test(tekst)) {
    visBesked("Kortbaggrunden kunne ikke kopieres til billedet (browseren blokerede kortfliserne). "
      + "Prøv at genindlæse siden og eksportere igen.", true);
  } else if (/Kunne ikke hente/.test(tekst)) {
    visBesked("Eksportbiblioteket kunne ikke hentes. Tjek at cdnjs.cloudflare.com ikke er blokeret på netværket.", true);
  } else {
    visBesked("Eksporten gik galt: " + tekst + " – tryk F12 og send fejlteksten fra Console i chatten.", true);
  }
}

function opsaetEksportknapper() {
  const luk = function () { const d = $("msEksport"); if (d) d.open = false; };
  $("eksPng").addEventListener("click", function () { luk(); eksporterPng(); });
  $("eksPdf").addEventListener("click", function () { luk(); eksporterPdf(); });
  $("eksPptx").addEventListener("click", function () { luk(); eksporterPptx(); });
  $("fExcel").addEventListener("click", eksporterExcel);
  document.addEventListener("click", function (e) {
    const d = $("msEksport"); if (d && d.open && !d.contains(e.target)) d.open = false;
  });
}

/* ===================================================================== */

function eksporterExcel() {
  const liste = synligListe;
  if (!liste || liste.length === 0) { visBesked("Der er ingen afdelinger at eksportere i den aktuelle visning.", true); return; }
  const kol = ["Afdeling","Virksomhed","Medlemstype","Afdelingstype","Land","By","Postnummer",
               "Adresse","Website","Sidst bekræftet","Latitude","Longitude"];
  const rows = [kol];
  liste.forEach(function (r) {
    rows.push([
      F(r, "navn") || "", F(r, "brand") || "", medlemstypeForAfd(r) || "",
      F(r, "afdelingstype") || "", F(r, "land") || "", F(r, "by") || "", F(r, "postnr") || "",
      F(r, "adresse") || "", F(r, "website") || "",
      bekraeftStatus(r).harDato ? bekraeftStatus(r).tekst : "",
      F(r, "lat") || "", F(r, "lon") || ""
    ]);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = kol.map(function (h, i) { return { wch: i === 7 ? 34 : (i === 0 || i === 1 ? 26 : 15) }; });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Afdelinger");
  XLSX.writeFile(wb, "afdelinger_" + idagISO() + ".xlsx");
}
function hentSide(side) {
  return ZOHO.CRM.API.getAllRecords({ Entity: CONFIG.modul, sort_order: "asc", per_page: 200, page: side });
}
async function hentAlle() {
  let side = 1, ud = [];
  while (side <= 25) {
    const svar = await hentSide(side);
    const data = (svar && svar.data) ? svar.data : [];
    ud = ud.concat(data);
    if (data.length < 200) break;
    side++;
  }
  return ud;
}
async function hentKontoMap() {
  let side = 1, map = {};
  while (side <= 25) {
    const svar = await ZOHO.CRM.API.getAllRecords({ Entity: "Accounts", sort_order: "asc", per_page: 200, page: side });
    const data = (svar && svar.data) ? svar.data : [];
    data.forEach(function (k) {
      map[String(k.id)] = { navn: k[CONFIG.konto.navnFelt] || "", type: k[CONFIG.konto.medlemstypeFelt] || "" };
    });
    if (data.length < 200) break;
    side++;
  }
  return map;
}
function findBrands() {
  const fundet = new Set();
  alleRecords.forEach(function (r) {
    const m = F(r, "medlem");
    if (m && String(m.id) === String(tilstand.kontoId)) { const b = F(r, "brand"); if (b) fundet.add(b); }
  });
  if (fundet.size === 0 && tilstand.kontoNavn) {
    const kontoLower = tilstand.kontoNavn.toLowerCase();
    const alleBrands = new Set(alleRecords.map(function (r) { return F(r, "brand"); }).filter(Boolean));
    alleBrands.forEach(function (b) {
      if (b.length >= CONFIG.minBrandLaengde && kontoLower.indexOf(b.toLowerCase()) !== -1) fundet.add(b);
    });
  }
  return Array.from(fundet);
}
function startMedlemstilstand() {
  tilstand.brands = findBrands();
  let liste;
  if (tilstand.brands.length > 0) liste = alleRecords.filter(function (r) { return tilstand.brands.indexOf(F(r, "brand")) !== -1; });
  else liste = alleRecords.filter(function (r) { const m = F(r, "medlem"); return m && String(m.id) === String(tilstand.kontoId); });
  if (liste.length === 0) {
    visBesked("Der er endnu ikke registreret afdelinger for dette medlem. "
      + "Tilføj dem via den relaterede liste „Afdelinger“ på kontoen.");
    return;
  }
  synligListe = liste;
  /* Eksportknapperne skal også være der på medlemsvisningen */
  $("filterbar").hidden = false;
  $("filterbar").classList.add("kun-eksport");
  opsaetEksportknapper();
  const res = tegnMarkers(liste);
  udsnitOpgave = opdaterUdsnit(liste);
  const navnetekst = tilstand.brands.length ? tilstand.brands.join(", ") : tilstand.kontoNavn;
  $("taeller").textContent = res.viste + " lokation(er)";
  opdaterBund(res, "Viser " + res.viste + " lokation(er) for " + navnetekst);
}
function opsaetMedlemstypeMultiselect() {
  const panel = $("msPanel"); panel.innerHTML = "";
  CONFIG.konto.alleMedlemstyper.forEach(function (t) {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.className = "mtype"; cb.value = t; cb.checked = true;
    cb.addEventListener("change", function () { opdaterMsSummary(); anvendFilter(); });
    label.appendChild(cb); label.appendChild(document.createTextNode(" " + t));
    panel.appendChild(label);
  });
  opdaterMsSummary();
}
function valgteMedlemstyper() {
  return Array.prototype.filter.call(document.querySelectorAll(".mtype"), function (c) { return c.checked; })
    .map(function (c) { return c.value; });
}
function opdaterMsSummary() {
  const valgt = valgteMedlemstyper(), alle = CONFIG.konto.alleMedlemstyper.length;
  $("msSummary").textContent = (valgt.length === alle) ? "Medlemstype: alle" : "Medlemstype: " + valgt.length + " valgt";
}
function udfyldFiltre() {
  const lande = Array.from(new Set(alleRecords.map(function (r) { return F(r, "land"); }).filter(Boolean)))
    .sort(function (a, b) { return a.localeCompare(b, "da"); });
  const brands = Array.from(new Set(alleRecords.map(function (r) { return F(r, "brand"); }).filter(Boolean)))
    .sort(function (a, b) { return a.localeCompare(b, "da"); });
  lande.forEach(function (l) { const o = document.createElement("option"); o.value = l; o.textContent = l; $("fLand").appendChild(o); });
  brands.forEach(function (b) { const o = document.createElement("option"); o.value = b; o.textContent = b; $("fBrand").appendChild(o); });
}
function anvendFilter() {
  const land = $("fLand").value, brand = $("fBrand").value, soeg = $("fSoeg").value.trim().toLowerCase();
  const kunForael = $("fForael").checked;
  const mtyper = valgteMedlemstyper();
  const alleValgt = mtyper.length === CONFIG.konto.alleMedlemstyper.length;
  const liste = alleRecords.filter(function (r) {
    if (land && F(r, "land") !== land) return false;
    if (brand && F(r, "brand") !== brand) return false;
    if (kunForael && !bekraeftStatus(r).foraeldet) return false;
    if (!alleValgt) { const mt = medlemstypeForAfd(r); if (mt && mtyper.indexOf(mt) === -1) return false; }
    if (soeg) {
      const tekst = [F(r, "navn"), F(r, "by"), F(r, "adresse"), F(r, "brand"), F(r, "land")]
        .filter(Boolean).join(" ").toLowerCase();
      if (tekst.indexOf(soeg) === -1) return false;
    }
    return true;
  });
  synligListe = liste;
  const res = tegnMarkers(liste);
  udsnitOpgave = opdaterUdsnit(liste);
  $("taeller").textContent = res.viste + " af " + alleRecords.length + " afdelinger";
  opdaterBund(res, res.hk + " hovedkontorer");
}
function startGlobalTilstand() {
  $("filterbar").hidden = false;
  udfyldFiltre();
  opsaetMedlemstypeMultiselect();
  $("fLand").addEventListener("change", anvendFilter);
  $("fBrand").addEventListener("change", anvendFilter);
  $("fSoeg").addEventListener("input", anvendFilter);
  $("fForael").addEventListener("change", anvendFilter);
  opsaetEksportknapper();
  $("fNulstil").addEventListener("click", function () {
    $("fLand").value = ""; $("fBrand").value = ""; $("fSoeg").value = ""; $("fForael").checked = false;
    Array.prototype.forEach.call(document.querySelectorAll(".mtype"), function (c) { c.checked = true; });
    opdaterMsSummary(); anvendFilter();
  });
  document.addEventListener("click", function (e) {
    const ms = $("msMedlemstype"); if (ms && ms.open && !ms.contains(e.target)) ms.open = false;
  });
  anvendFilter();
}
async function vedPageLoad(data) {
  if (startTimeout) { clearTimeout(startTimeout); startTimeout = null; }
  try {
    visBesked("Henter afdelinger …");
    const resultater = await Promise.all([hentAlle(), hentKontoMap()]);
    alleRecords = resultater[0];
    kontoMap = resultater[1];
    skjulBesked();
    const entitet = data && (data.Entity || data.entity);
    let id = data && (data.EntityId || data.entityId);
    if (Array.isArray(id)) id = id[0];
    if (entitet === "Accounts" && id) {
      tilstand.mode = "medlem"; tilstand.kontoId = id;
      try {
        const k = await ZOHO.CRM.API.getRecord({ Entity: "Accounts", RecordID: id });
        if (k && k.data && k.data[0]) tilstand.kontoNavn = k.data[0].Account_Name || "";
      } catch (e) { console.warn("Kunne ikke hente kontonavn:", e); }
      startMedlemstilstand();
    } else {
      tilstand.mode = "global"; startGlobalTilstand();
    }
  } catch (fejl) { visFejl(fejl); }
}
document.addEventListener("DOMContentLoaded", function () {
  initKort();
  if (!window.ZOHO || !ZOHO.embeddedApp) {
    visBesked("Zoho-SDK'et kunne ikke indlæses. Siden skal åbnes inde fra Zoho CRM.", true);
    return;
  }
  startTimeout = setTimeout(function () {
    visBesked("Denne side skal åbnes inde i Zoho CRM (som relateret liste eller webfane) – "
      + "den virker ikke som selvstændig fil.", true);
  }, 10000);
  ZOHO.embeddedApp.on("PageLoad", vedPageLoad);
  ZOHO.embeddedApp.init();
});
