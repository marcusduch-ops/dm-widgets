<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afdelingskort</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column;
         font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
         padding: 8px 10px; border-bottom: 1px solid #e3e3e3; background: #fafafa; }
  .top select, .top input {
         padding: 6px 8px; border: 1px solid #c9c9c9; border-radius: 6px;
         font-size: 13px; background: #fff; }
  .top input[type=text] { min-width: 170px; }
  .top button, .knap { padding: 6px 12px; border: 1px solid #c9c9c9; border-radius: 6px;
         background: #fff; color: #1c1c1c; font-size: 13px; cursor: pointer; }
  .top button:hover, .knap:hover { background: #f0f0f0; }
  .knap-excel { background: #eef4fb; border-color: #bcd3ee; color: #1c1c1c; font-weight: 600; }
  .knap-excel:hover { background: #e0ecf9; }
  .knap[disabled], .top button[disabled] { opacity: .5; cursor: not-allowed; background: #fff; }
  #taeller { font-size: 12.5px; color: #555; margin-left: auto; }
  #kort { flex: 1; min-height: 260px; background: #e9edf1; }
  .besked { padding: 14px 16px; font-size: 14px; background: #fff7e6;
            color: #7a4b00; border-bottom: 1px solid #f0dcb4; }
  .besked.fejl { background: #fdecec; color: #8a1f1f; border-color: #f2c4c4; }
  .bund { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
          padding: 6px 10px; font-size: 12px; color: #666;
          border-top: 1px solid #e3e3e3; background: #fafafa; }
  .sig { display: inline-flex; align-items: center; gap: 5px; }
  .sig .prik { width: 12px; height: 12px; border-radius: 50%; display: inline-block;
               border: 1px solid rgba(0,0,0,.25); }
  .pop { font-size: 13px; line-height: 1.45; max-width: 240px; }
  .pop-navn  { font-weight: 600; margin-bottom: 2px; }
  .pop-brand { color: #666; font-size: 12px; margin-bottom: 4px; }
  .pop-type { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
            border: 1px solid; margin-bottom: 6px; font-weight: 600; }
  .pop-adr   { margin-bottom: 6px; }
  .pop-bekraeft { font-size: 12px; color: #1c6b2c; margin-bottom: 6px; }
  .pop-bekraeft.foraeldet { color: #c0392b; font-weight: 600; }
  .pop-links a { color: #1a56a0; text-decoration: none; }
  .pop-links a:hover { text-decoration: underline; }
  .pin { width: 26px; height: 41px; position: relative; }
  .pin svg { width: 26px; height: 41px; display: block;
             filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .pin-label { background: rgba(255,255,255,.92); border: 1px solid #cfd6df;
               border-radius: 5px; padding: 1px 6px; font-size: 11.5px; font-weight: 600;
               color: #222; box-shadow: 0 1px 3px rgba(0,0,0,.18); white-space: nowrap; }
  .pin-label::before { display: none; }
  .leaflet-container:not(.zoomet) .pin-label { display: none; }
  .gruppe-pin { width: 32px; height: 32px; border-radius: 50%; display: flex;
                align-items: center; justify-content: center; cursor: pointer;
                background: #2a81cb; color: #fff; font-size: 13px; font-weight: 700;
                border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,.35); }
  .gruppe-pin:hover { filter: brightness(.88); }
  .lande-navn { display: flex; align-items: center; justify-content: center;
                width: 100%; height: 100%; white-space: nowrap;
                font-weight: 700; letter-spacing: .14em;
                text-transform: uppercase; color: rgba(15, 63, 107, .34);
                text-shadow: 0 1px 0 rgba(255,255,255,.65); pointer-events: none; }
  .leaflet-container.naerzoom .lande-navn { display: none; }
  .ms { position: relative; }
  .ms > summary { list-style: none; cursor: pointer; padding: 6px 10px;
         border: 1px solid #c9c9c9; border-radius: 6px; background: #fff; font-size: 13px; user-select: none; }
  .ms > summary::-webkit-details-marker { display: none; }
  .ms > summary::after { content: " ▾"; color: #888; }
  .ms-panel { position: absolute; z-index: 1200; top: 112%; left: 0; background: #fff;
         border: 1px solid #c9c9c9; border-radius: 8px; padding: 8px 10px;
         box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 200px; }
  .ms-panel label { display: flex; align-items: center; gap: 6px; font-size: 13px;
         padding: 3px 0; white-space: nowrap; cursor: pointer; }

  /* ---------- Eksport ---------- */
  #eksportGruppe { display: flex; gap: 8px; align-items: center; }
  #eksHint { font-size: 12px; color: #7a4b00; }
  /* Medlemsvisning: kun landevælger og eksport i baren */
  .top.kun-eksport > *:not(#eksportGruppe):not(#taeller):not(#fLand) { display: none; }
  #eksportSkaerm { position: fixed; inset: 0; z-index: 100000;
        background: rgba(255,255,255,.94); display: flex; align-items: center;
        justify-content: center; flex-direction: column; gap: 10px;
        font-size: 14px; color: #333; }
  #eksportSkaerm .spin { width: 26px; height: 26px; border: 3px solid #d6e2f0;
        border-top-color: #2a81cb; border-radius: 50%; animation: snurr .8s linear infinite; }
  @keyframes snurr { to { transform: rotate(360deg); } }

  /* ---------- Eksportdialog ---------- */
  .dlg-bag { position: fixed; inset: 0; z-index: 99000; background: rgba(16,38,61,.45);
        display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dlg-bag[hidden] { display: none; }
  .dlg { background: #fff; border-radius: 10px; width: min(1180px, 100%);
        max-height: calc(100vh - 32px); display: flex; flex-direction: column;
        box-shadow: 0 12px 40px rgba(0,0,0,.25); overflow: hidden; }
  .dlg-hoved { display: flex; justify-content: space-between; align-items: center;
        padding: 10px 12px 10px 16px; border-bottom: 1px solid #e3e3e3; }
  .dlg-hoved h2 { margin: 0; font-size: 16px; font-weight: 600; color: #1c1c1c; }
  .dlg-luk { border: 0; background: none; font-size: 24px; line-height: 1; cursor: pointer;
        width: 40px; height: 40px; border-radius: 6px; color: #444; }
  .dlg-luk:hover { background: #f0f0f0; }
  .dlg-krop { display: flex; gap: 16px; padding: 16px; overflow: auto; flex-wrap: wrap; }
  .dlg-valg { flex: 0 0 270px; display: flex; flex-direction: column; gap: 16px; }
  .dlg-valg fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .dlg-valg legend { font-size: 11.5px; font-weight: 600; color: #555; text-transform: uppercase;
        letter-spacing: .06em; margin-bottom: 6px; padding: 0; }
  .lay { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: start;
        padding: 8px 10px; border: 1px solid #d6dee7; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .lay input { grid-row: span 2; margin: 2px 0 0; }
  .lay small { color: #666; font-size: 12px; }
  .lay:has(input:checked) { border-color: #2a81cb; background: #eef4fb; }
  .chk { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
  .chk[hidden] { display: none; }
  .chk em { color: #777; font-style: normal; }
  .dlg-knapper { display: flex; gap: 8px; flex-wrap: wrap; }
  .dlg-knapper button { flex: 1 1 auto; padding: 9px 10px; border: 1px solid #bcd3ee; border-radius: 6px;
        background: #eef4fb; font-size: 13px; font-weight: 600; cursor: pointer; color: #1c1c1c; }
  .dlg-knapper button:hover { background: #e0ecf9; }
  .dlg-knapper button[hidden] { display: none; }
  .dlg-note { font-size: 12px; line-height: 1.45; color: #7a4b00; background: #fff7e6;
        border-radius: 6px; padding: 8px 10px; margin: 0; }
  .dlg-note.fejl { color: #8a1f1f; background: #fdecec; }
  .dlg-note:empty { display: none; }
  .dlg-preview { flex: 1 1 520px; min-width: 0; background: #e9edf1; border-radius: 8px; padding: 14px;
        display: flex; align-items: center; justify-content: center; min-height: 320px; }
  .dlg-preview svg { width: 100%; height: auto; display: block; background: #fff;
        box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .dlg-preview.a4 svg { width: auto; height: min(72vh, 820px); max-width: 100%; }
  .dlg-vent { font-size: 13px; color: #555; }
  #eksPreview { display: flex; justify-content: center; }
</style>
</head>
<body>
<div class="top" id="filterbar" hidden>
  <select id="fLand"><option value="">Alle lande</option></select>
  <select id="fBrand"><option value="">Alle virksomheder</option></select>
  <details class="ms" id="msMedlemstype">
    <summary id="msSummary">Medlemstype: alle</summary>
    <div class="ms-panel" id="msPanel"></div>
  </details>
  <details class="ms" id="msAfdelingstype">
    <summary id="atSummary">Afdelingstype: alle</summary>
    <div class="ms-panel" id="atPanel"></div>
  </details>
  <input id="fSoeg" type="text" placeholder="Søg afdeling, by eller adresse …">
  <label style="font-size:12.5px;color:#555;display:flex;align-items:center;gap:5px;">
    <input type="checkbox" id="fForael"> Kun forældede
  </label>
  <button id="fNulstil" type="button">Nulstil</button>
  <div id="eksportGruppe">
    <button id="fExcel" type="button" class="knap">⬇ Excel</button>
    <button id="fEksport" type="button" class="knap knap-excel" disabled>⬇ Eksportér kort …</button>
    <span id="eksHint"></span>
  </div>
  <span id="taeller"></span>
</div>
<div class="besked" id="besked" hidden></div>
<div id="kort"></div>
<div class="bund" id="bund" hidden></div>

<div class="dlg-bag" id="eksDialog" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitel">
    <div class="dlg-hoved">
      <h2 id="dlgTitel">Eksportér kort</h2>
      <button type="button" class="dlg-luk" id="dlgLuk" aria-label="Luk">×</button>
    </div>
    <div class="dlg-krop">
      <div class="dlg-valg">
        <fieldset>
          <legend>Layout</legend>
          <label class="lay"><input type="radio" name="eksLayout" value="callout" checked>
            <strong>Callout-kort</strong><small>16:9 · byerne i en kolonne med streger til kortet</small></label>
          <label class="lay"><input type="radio" name="eksLayout" value="tabel">
            <strong>Kort + bytabel</strong><small>16:9 · bobler på kortet og tabel – god til mange byer</small></label>
          <label class="lay"><input type="radio" name="eksLayout" value="faktaark">
            <strong>Faktaark</strong><small>A4 · til print og uddeling</small></label>
        </fieldset>
        <fieldset>
          <legend>Indhold</legend>
          <label class="chk" id="lblFakta"><input type="checkbox" id="eksFakta"> Med faktaboks <em>(eksempeldata)</em></label>
          <label class="chk"><input type="checkbox" id="eksTyper"> Vis afdelingstyper</label>
        </fieldset>
        <fieldset>
          <legend>Hent som</legend>
          <div class="dlg-knapper">
            <button type="button" id="eksPng">⬇ PNG</button>
            <button type="button" id="eksPdf">⬇ PDF</button>
            <button type="button" id="eksPptx">⬇ PowerPoint</button>
          </div>
        </fieldset>
        <p class="dlg-note" id="eksNote"></p>
      </div>
      <div class="dlg-preview" id="eksPreviewRamme"><div id="eksPreview" style="width:100%"></div></div>
    </div>
  </div>
</div>

<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script id="hovedscript">
"use strict";
/* =====================================================================
   KONFIGURATION — skal matche API-navnene i CRM. Ret KUN her.
   ===================================================================== */
const CONFIG = {
  modul: "Afdelinger",
  felter: {
    navn:         "Name",
    medlem:       "Medlem",
    brand:        "Brand",
    land:         "Land",
    adresse:      "Adresse",
    postnr:       "Postnummer",
    by:           "By",
    website:      "Website",
    lat:          "Latitude",
    lon:          "Longitude",
    bekraeftet:   "Sidst_bekraeftet",
    afdelingstype:"Afdelingstype"
  },
  minBrandLaengde: 3,
  bekraeftGraenseDage: 365,
  hovedkontorType: "Dansk hovedkontor",
  labelZoom: 8,
  /* --- Afdelingstyper ---------------------------------------------------
     VIGTIGT: værdierne skal findes i picklisten "Afdelingstype" i CRM, ellers
     afviser Zoho dem ved oprettelse. Tilføj dem under
     Opsætning → Tilpasning → Moduler → Afdelinger → feltet Afdelingstype.
     En widget kan ikke selv oprette pickliste-værdier.
     "navn" skal stå præcis som i CRM. "alias" fanger stavevarianter i data,
     fx flertalsformer, så gamle poster stadig får rigtig farve.
     "en" er navnet der bruges i det eksporterede (engelske) materiale. --------- */
  afdelingstyper: [
    { navn: "Dansk hovedkontor", en: "Danish headquarters", farve: "#2e9e4f", tegn: "🏢", alias: ["hovedkontor", "hq", "headquarters"] },
    { navn: "Agent",             en: "Agent",               farve: "#d2791e", tegn: "🤝", alias: ["agenter", "agentur", "agency"] },
    { navn: "Licenstager",       en: "Licensee",            farve: "#8250b8", tegn: "📜", alias: ["licenstagere", "licensee", "licenshaver"] },
    { navn: "Salgskontor",       en: "Sales office",        farve: "#2a81cb", tegn: "",   alias: ["salgskontorer", "salesoffice"] },
    { navn: "Produktion",        en: "Production",          farve: "#0f8f8f", tegn: "🏭", alias: ["fabrik", "produktionssted"] },
    { navn: "Serviceværksted",   en: "Service workshop",    farve: "#b5396b", tegn: "🔧", alias: ["service", "vaerksted"] }
  ],
  ukendtTypeFarve: "#7a8794",   // farve for typer der ikke står på listen
  ukendtTypeNavn:  "Øvrige",
  ukendtTypeNavnEn: "Other",
  konto: {
    navnFelt:        "Account_Name",
    medlemstypeFelt: "Medlemstype",
    alleMedlemstyper: ["DI - Ordinær", "Associeret", "Iværksættermedlem", "Støttemedlem"]
  },
  /* --- Landegrupper ---
     Områder der skal tælle med under et andet land, når man vælger det land.
     Nøglerne er ISO-landekoder. Med CN: ["HK", "MO"] kommer afdelinger i
     Hong Kong og Macao med, når man vælger Kina – ligesom på jeres Kina-slide.
     Vælger man "Hong Kong" alene, vises kun Hong Kong. Slet linjen for at slå det fra. */
  landegrupper: {
    CN: ["HK", "MO"]
  },
  /* --- Kortbaggrund og udsnit ---
     Fliser: OpenStreetMap Standard er gratis og kræver ingen nøgle.
     Vil du have skarpere landegrænser og mere læsbare landenavne, kan du skifte
     til CARTO Voyager. Den kræver en gratis nøgle (ingen konto, 5 mio. fliser/md.,
     erhvervsbrug tilladt) – hentes på https://carto.com/basemaps/apikey/ , og
     nøglen sættes på URL'en efter vejledningen der. Uden nøgle lægger CARTO et
     "API KEY REQUIRED"-vandmærke hen over kortet.
       fliserUrl: "https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=DIN_NOEGLE",
       fliserKredit: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-bidragydere &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'
  */
  kort: {
    fliserUrl:    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    fliserKredit: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-bidragydere',
    fliserMaxZoom: 19,
    visLandenavn:    true,   // stort, dæmpet landenavn når visningen er ét land
    visLandegraense: true,   // omrids af landet (hentes fra CDN første gang)
    graensedata: "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json",
    /* topojson-client ligger IKKE på cdnjs – hentes fra jsDelivr med unpkg som reserve */
    topojsonLib: ["https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js",
                  "https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"],
    enkeltPinZoom: 7,        // zoom når der kun er én afdeling og intet land kan bestemmes
    maksZoom:      9,        // kortet zoomer aldrig tættere på end dette af sig selv
    faaAfdelinger: 20,       // op til så mange afdelinger vises uden klynger og med navn på hver
    samlPx:        26        // pins tættere på hinanden end så mange pixels samles i én gruppe
  },
  /* --- Eksport: tekster og farve i det eksporterede materiale (på engelsk) --- */
  eksport: {
    organisation:   "Danske Maritime",                  // bruges i widget'ens danske tekster
    organisationEn: "Danish Maritime",                  // bruges i eksporten
    overlinje:      "INTERNATIONAL FOOTPRINT",
    titel:          "{org} members in {land}",          // {org} og {land} udskiftes automatisk
    kildetekst:     "Source: {org} member database, {dato} · Map data: Natural Earth",
    kontakt:        "Contact: [NAME, E-MAIL] · danskemaritime.dk",
    accentfarve:    "#0f3f6b",
    boblefarve:     "#1f6fb5",
    tekstfarve:     "#10263d",
    broedtekst:     "#2c3e52",
    daempet:        "#4f6072",
    landFyld:       "#d3e3f3",
    landKant:       "#7fa6cc",
    naboFyld:       "#e9edf1",
    skrift:         "'Segoe UI', Arial, sans-serif",    // systemskrift, så tekst måles og tegnes ens
    pptxSkrift:     "Segoe UI",
    skala16x9:      2,      // opløsning på PNG/PDF (2 = 3200 × 1800 px)
    skalaA4:        3,      // opløsning på faktaarket (3 ≈ 290 dpi)
    maxBilagRaekker: 600,
    /* Engelske landenavne hentes automatisk fra browseren. Her kan de rettes,
       fx hvor der skal stå "the" foran. Nøglen er ISO-landekoden. */
    landenavne: {
      US: "the United States", GB: "the United Kingdom", NL: "the Netherlands",
      AE: "the United Arab Emirates", PH: "the Philippines", BS: "the Bahamas",
      DO: "the Dominican Republic", CZ: "the Czech Republic", FO: "the Faroe Islands",
      KY: "the Cayman Islands", MV: "the Maldives", CF: "the Central African Republic",
      CD: "the Democratic Republic of the Congo", HK: "Hong Kong", MO: "Macao",
      KR: "South Korea", KP: "North Korea", TR: "Türkiye"
    }
  },
  /* --- Faktaboks (eksempeldata) ---
     Tallene ligger ikke i CRM endnu og er derfor faste eksempler.
     "lande" har tal pr. land (ISO-kode). Lande uden egne tal får "standard",
     hvor {land} udskiftes med landets engelske navn. */
  faktaboks: {
    kilde: "[SOURCE]",
    standard: [
      { tal: "[XX]",    tekst: "Danish maritime subsidiaries in {land}" },
      { tal: "[X,XXX]", tekst: "full-time jobs in those subsidiaries" },
      { tal: "[X%]",    tekst: "of Danish maritime exports go to {land}" }
    ],
    lande: {
      CN: {
        kilde: "[SOURCE]",
        felter: [
          { tal: "36",    tekst: "Danish maritime subsidiaries in China" },
          { tal: "5,462", tekst: "full-time jobs in those subsidiaries" },
          { tal: "~7%",   tekst: "of Danish maritime exports went to China in 2024" }
        ]
      }
    }
  },
  /* Eksportbibliotekerne hentes først når de skal bruges.
     Hver linje er en liste af spejle, der prøves oppefra og ned, så en enkelt
     blokeret eller utilgængelig vært ikke slår funktionen ud.
     NB: PptxGenJS findes ikke på cdnjs – derfor jsDelivr/unpkg. */
  cdn: {
    d3:          ["https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js",
                  "https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"],
    jspdf:       ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
                  "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"],
    pptxgen:     ["https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js",
                  "https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"]
  }
};
/* ===================================================================== */

let kort, cluster, fliselag;
let alleRecords = [];
let kontoMap = {};
let synligListe = [];
let medlemsAlle = [];
const tilstand = { mode: "global", kontoId: null, kontoNavn: "", brands: [] };
let startTimeout = null;

function pinSvg(farve) {
  return '<div class="pin"><svg viewBox="0 0 26 41" xmlns="http://www.w3.org/2000/svg">'
    + '<path d="M13 0C5.8 0 0 5.8 0 13c0 9 13 28 13 28s13-19 13-28C26 5.8 20.2 0 13 0z" fill="'
    + farve + '"/>'
    + '<circle cx="13" cy="13" r="5" fill="#ffffff" fill-opacity="0.9"/></svg></div>';
}
const ikonCache = {};
function ikonFor(farve) {
  if (!ikonCache[farve]) {
    ikonCache[farve] = L.divIcon({ className: "", html: pinSvg(farve),
      iconSize: [26, 41], iconAnchor: [13, 41], popupAnchor: [0, -36] });
  }
  return ikonCache[farve];

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function F(rec, noegle) { return rec[CONFIG.felter[noegle]]; }

/* Fælles normalisering: små bogstaver, æøå og accenter væk, kun bogstaver og tal */
function normTekst(s) {
  return String(s == null ? "" : s).toLowerCase()
    .replace(/æ/g, "ae").replace(/ø/g, "oe").replace(/å/g, "aa")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]/g, "");
}

/* =====================================================================
   AFDELINGSTYPER — farve og mærkat pr. type, slået op på navn eller alias.
   ===================================================================== */
let typeIndeks = null;
function byggTypeIndeks() {
  typeIndeks = {};
  CONFIG.afdelingstyper.forEach(function (t) {
    [t.navn].concat(t.alias || []).forEach(function (n) {
      const k = normTekst(n);
      if (k && !typeIndeks[k]) typeIndeks[k] = t;
    });
  });
}
/* Returnerer typedefinitionen for en post, eller null hvis typen er ukendt */
function typeDef(r) {
  if (!typeIndeks) byggTypeIndeks();
  const raa = F(r, "afdelingstype");
  if (!raa) return null;
  return typeIndeks[normTekst(raa)] || null;
}
function typeFarve(r) {
  const t = typeDef(r);
  return t ? t.farve : CONFIG.ukendtTypeFarve;
}
function farveForTypenavn(navn) {
  if (!typeIndeks) byggTypeIndeks();
  const t = typeIndeks[normTekst(navn)];
  return t ? t.farve : CONFIG.ukendtTypeFarve;
}
/* Navnet som det skal stå i signaturforklaringen */
function typeEtiket(r) {
  const t = typeDef(r);
  if (t) return t.navn;
  const raa = F(r, "afdelingstype");
  return raa ? String(raa) : CONFIG.ukendtTypeNavn;
}
/* Engelsk typenavn til eksporten */
function engelskTypenavn(navn) {
  if (!typeIndeks) byggTypeIndeks();
  const t = typeIndeks[normTekst(navn)];
  if (t) return t.en || t.navn;
  if (normTekst(navn) === normTekst(CONFIG.ukendtTypeNavn)) return CONFIG.ukendtTypeNavnEn;
  return String(navn);
}
/* De typer der optræder i en liste, i den rækkefølge CONFIG angiver */
function typerIVisning(liste) {
  const set = {};
  liste.forEach(function (r) {
    const e = typeEtiket(r);
    if (!set[e]) set[e] = { navn: e, farve: typeFarve(r), antal: 0 };
    set[e].antal++;
  });
  const raekke = CONFIG.afdelingstyper.map(function (t) { return t.navn; });
  return Object.keys(set).map(function (k) { return set[k]; }).sort(function (a, b) {
    const ia = raekke.indexOf(a.navn), ib = raekke.indexOf(b.navn);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
}
/* Alle typeværdier der findes i data – bruges til filteret */
function alleTyperIData() {
  const set = {};
  alleRecords.forEach(function (r) { set[typeEtiket(r)] = true; });
  CONFIG.afdelingstyper.forEach(function (t) { set[t.navn] = true; });
  const raekke = CONFIG.afdelingstyper.map(function (t) { return t.navn; });
  return Object.keys(set).sort(function (a, b) {
    const ia = raekke.indexOf(a), ib = raekke.indexOf(b);
    if (ia !== ib) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    return a.localeCompare(b, "da");
  });
}
function erHovedkontor(r) {

}

function toCifre(n) { return (n < 10 ? "0" : "") + n; }

function bekraeftStatus(rec) {

  const d = new Date(raa);
  if (isNaN(d.getTime())) return { harDato: false, foraeldet: true, tekst: String(raa) };
  const alderDage = (Date.now() - d.getTime()) / 86400000;

}
function initKort() {

     rammen bedre end de faste hele trin tillader. */
  kort = L.map("kort", { worldCopyJump: true, zoomSnap: 0.25, zoomDelta: 1 }).setView([25, 10], 2);
  fliselag = L.tileLayer(CONFIG.kort.fliserUrl, {
    maxZoom: CONFIG.kort.fliserMaxZoom,
    attribution: CONFIG.kort.fliserKredit
  }).addTo(kort);
  /* Eget lag mellem fliser og pins til landeomrids og landenavn */
  kort.createPane("landepane");

  kort.getPane("landepane").style.pointerEvents = "none";
  benRenderer = L.canvas({ pane: "landepane", padding: 0.5 });
  /* Klynger bruges kun når der er mange afdelinger i visningen. Klik zoomer ind,
     og er man helt inde ved sammenfaldende adresser, folder klyngen sig ud. */
  cluster = L.markerClusterGroup({
    showCoverageOnHover: false, maxClusterRadius: 45, spiderfyOnMaxZoom: true
  });
  kort.addLayer(cluster);
  kort.on("zoomend", function () {
    /* Gruppering afhænger af zoom – byg om og fold sammen igen */
    if (simpelLag) { udfoldetIndeks = -1; opbygSimpel(); }
    opdaterLabelSynlighed();
  });
  kort.on("click", function () {
    if (simpelLag && udfoldetIndeks !== -1) { udfoldetIndeks = -1; opbygSimpel(); }
  });

function opdaterLabelSynlighed() {

function koordFor(r) {
  const la = parseFloat(F(r, "lat")), lo = parseFloat(F(r, "lon"));
  return (isNaN(la) || isNaN(lo)) ? null : L.latLng(la, lo);
}
function lavMarkoer(r, ll, tip) {
  const m = L.marker(ll, { icon: ikonFor(typeFarve(r)) });
  m.bindPopup(popupHtml(r));
  const label = medlemsNavn(r);
  if (label) {
    m.bindTooltip(esc(label), Object.assign({
      permanent: true, direction: "top", offset: [0, -38], className: "pin-label", opacity: 1
    }, tip || {}));
  }
  return m;
}
/* Ved udfoldning lægges navnet ud til den side pin'en peger, så de ikke overlapper */
function tipRetning(vinkel) {
  const cos = Math.cos(vinkel), sin = Math.sin(vinkel);
  if (cos > 0.35)  return { direction: "right", offset: [12, -20] };
  if (cos < -0.35) return { direction: "left",  offset: [-12, -20] };
  if (sin < 0)     return { direction: "top",   offset: [0, -38] };
  return { direction: "bottom", offset: [0, 4] };
}

function tegnMarkers(liste) {
  cluster.clearLayers();
  if (simpelLag) { kort.removeLayer(simpelLag); simpelLag = null; }
  simpelPoster = [];
  grupper = [];
  udfoldetIndeks = -1;

  const medKoord = [];
  let udenKoordinater = 0, antalHK = 0;
  liste.forEach(function (r) {
    if (!koordFor(r)) { udenKoordinater++; return; }
    if (erHovedkontor(r)) antalHK++;
    medKoord.push(r);
  });
  antalViste = medKoord.length;
  pinRamme = medKoord.length ? L.latLngBounds(medKoord.map(koordFor)) : null;

  if (medKoord.length && medKoord.length <= CONFIG.kort.faaAfdelinger) {
    /* Få afdelinger: hver sin pin med navn, og sammenfaldende adresser
       samles i en klikbar gruppe der kan foldes ud. */
    simpelPoster = medKoord;
    simpelLag = L.layerGroup().addTo(kort);
    opbygSimpel();
  } else {
    synligePins = medKoord.map(function (r) { return lavMarkoer(r, koordFor(r)); });
    cluster.addLayers(synligePins);
  }
  opdaterLabelSynlighed();
  return { viste: medKoord.length, uden: udenKoordinater, hk: antalHK };
}

/* =====================================================================
   SAMMENFALDENDE ADRESSER — flere medlemmer i samme by får tit præcis
   samme koordinat, så pins lægger sig oven på hinanden. De samles i én
   gruppe som kan foldes ud med et klik.
   ===================================================================== */
function gruppeIkon(g) {
  /* Én farve hvis gruppen kun rummer én type, ellers en neutral */
  const farver = [];
  g.poster.forEach(function (r) { const f = typeFarve(r); if (farver.indexOf(f) === -1) farver.push(f); });
  const farve = farver.length === 1 ? farver[0] : "#55657a";
  return L.divIcon({
    className: "",
    html: '<div class="gruppe-pin" style="background:' + farve + '">' + g.poster.length + "</div>",
    iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -16]
  });
}
function gruppeNavn(g) {
  const brands = [];
  g.poster.forEach(function (r) { const b = medlemsNavn(r); if (b && brands.indexOf(b) === -1) brands.push(b); });
  const by = F(g.poster[0], "by");
  if (brands.length === 1) return brands[0] + " (" + g.poster.length + ")";
  return (by ? by + ": " : "") + g.poster.length + " afdelinger";
}
function byggGrupper(poster) {
  const z = kort.getZoom(), ud = [];
  poster.forEach(function (r) {
    const ll = koordFor(r), p = kort.project(ll, z);
    let fundet = null;
    for (let i = 0; i < ud.length; i++) {
      if (p.distanceTo(ud[i].p) <= CONFIG.kort.samlPx) { fundet = ud[i]; break; }
    }
    if (fundet) fundet.poster.push(r);
    else ud.push({ p: p, ll: ll, poster: [r] });
  });
  return ud;
}
function opbygSimpel() {
  if (!simpelLag) return;
  /* Luk de faste labels før laget ryddes, så ingen bliver hængende på kortet */
  simpelLag.eachLayer(function (l) { if (l.closeTooltip) l.closeTooltip(); });
  simpelLag.clearLayers();
  synligePins = [];
  grupper = byggGrupper(simpelPoster);
  const z = kort.getZoom();
  grupper.forEach(function (g, i) {
    if (g.poster.length === 1) {
      const m = lavMarkoer(g.poster[0], g.ll);
      synligePins.push(m); simpelLag.addLayer(m);
      return;
    }
    if (udfoldetIndeks === i) {
      const n = g.poster.length, radius = Math.max(46, 15 * n);
      g.poster.forEach(function (r, k) {
        const v = (2 * Math.PI * k) / n - Math.PI / 2;
        const ll2 = kort.unproject(L.point(g.p.x + radius * Math.cos(v), g.p.y + radius * Math.sin(v)), z);
        simpelLag.addLayer(L.polyline([g.ll, ll2], {
          pane: "landepane", renderer: benRenderer, interactive: false,
          color: "#5b6b7d", weight: 1, opacity: .6
        }));
        const m = lavMarkoer(r, ll2, tipRetning(v));
        synligePins.push(m); simpelLag.addLayer(m);
      });
    } else {
      const m = L.marker(g.ll, { icon: gruppeIkon(g), title: "Klik for at folde de " + g.poster.length + " afdelinger ud" });
      m.bindTooltip(esc(gruppeNavn(g)), { permanent: true, direction: "top", offset: [0, -20], className: "pin-label", opacity: 1 });
      m.on("click", function (e) {
        L.DomEvent.stopPropagation(e);
        udfoldetIndeks = (udfoldetIndeks === i) ? -1 : i;
        opbygSimpel();
      });
      synligePins.push(m); simpelLag.addLayer(m);
    }
  });
  opdaterLabelSynlighed();
}

/* =====================================================================

let udsnitOpgave = Promise.resolve();

function landeIkon(navn, str) {

async function hentVerden() {
  await indlaesScript(CONFIG.kort.topojsonLib);

    const svar = await fetch(CONFIG.kort.graensedata);
    if (!svar.ok) throw new Error("Grænsedata svarede " + svar.status);
    verdensdata = await svar.json();

  if (!verdensFeatures) {

  }

async function hentLandegraense(numre) {
  const feats = await hentVerden();
  const set = {};
  numre.forEach(function (n) { set[parseInt(n, 10)] = true; });
  const fundet = feats.filter(function (f) { return set[parseInt(f.id, 10)]; });
  if (!fundet.length) throw new Error("Landet findes ikke i grænsedataene: " + numre.join(", "));
  return { type: "FeatureCollection", features: fundet };
}

/* Opdaterer landelaget og tilpasser udsnittet. Kaldes efter hver filtrering. */
async function opdaterUdsnit(liste) {
  if (landeLag) { kort.removeLayer(landeLag); landeLag = null; }
  landeRamme = null;
  const noegler = landeNoegler(liste);
  if (noegler.length === 1 && noegler[0].charAt(0) !== "?") {
    const iso = noegler[0];
    const d = landFraIso(iso);
    const visNavn = danskLandenavn(liste, iso);
    if (d) {
      landeLag = L.layerGroup().addTo(kort);
      landeRamme = L.latLngBounds([d.bb[1], d.bb[0]], [d.bb[3], d.bb[2]]);
      if (CONFIG.kort.visLandenavn) {
        L.marker([d.c[1], d.c[0]], {
          icon: landeIkon(visNavn, 30), interactive: false, keyboard: false, pane: "landepane"
        }).addTo(landeLag);
      }
      tilpasUdsnit();
      if (CONFIG.kort.visLandegraense) {
        try {
          const gj = await hentLandegraense(landeNumre(iso));
          if (!landeLag) return;                       /* filteret er skiftet imens */
          const omrids = L.geoJSON(gj, {
            pane: "landepane", interactive: false,
            renderer: benRenderer,
            style: { color: CONFIG.eksport.accentfarve, weight: 1.6, opacity: .55,
                     fillColor: CONFIG.eksport.accentfarve, fillOpacity: .06 }
          }).addTo(landeLag);
          landeRamme = omrids.getBounds();
        } catch (e) {
          console.warn("Landeomrids kunne ikke hentes:", e);
          if (!omridsAdvaret) {
            omridsAdvaret = true;
            visBesked("Landets omrids kunne ikke hentes (" + ((e && e.message) || e)
              + "). Kortet virker, men landegrænsen tegnes ikke. Sæt visLandegraense til false "
              + "i CONFIG.kort hvis beskeden skal væk.");
          }
        }
      }
    }
  } else if (noegler.length === 1) {
    console.info("Ukendt landenavn – kortet rammes ind efter kontorerne i stedet:", noegler[0]);
  }
  tilpasUdsnit();
}

function tilpasUdsnit() {
  let ramme = null;
  if (landeRamme) ramme = L.latLngBounds(landeRamme.getSouthWest(), landeRamme.getNorthEast());
  if (pinRamme) {
    const pb = L.latLngBounds(pinRamme.getSouthWest(), pinRamme.getNorthEast());
    ramme = ramme ? ramme.extend(pb) : pb;
  }
  if (!ramme || !ramme.isValid()) return;
  if (ramme.getNorth() === ramme.getSouth() && ramme.getEast() === ramme.getWest()) {
    kort.setView(ramme.getCenter(), CONFIG.kort.enkeltPinZoom, { animate: false });
  } else {
    kort.fitBounds(ramme.pad(0.08), { maxZoom: CONFIG.kort.maksZoom, animate: false });
  }
  opdaterLabelSynlighed();
}

  if (bb[2] - bb[0] < 3) { bb[0] = cx - 1.5; bb[2] = cx + 1.5; smaa = true; }
  if (bb[3] - bb[1] < 2) { bb[1] = cy - 1; bb[3] = cy + 1; smaa = true; }
  const egne = {};
  d.numre.forEach(function (x) { egne[parseInt(x, 10)] = true; });
  /* Kortet rammes ind efter landets egentlige omrids (kun hovedlandet –
     fjerne oversøiske områder springes over) plus alle afdelinger. */
  const dele = [];
  if (d.land) {
    const bx = d.land.bb, mx = (bx[2] - bx[0]) * 0.15 + 1, my = (bx[3] - bx[1]) * 0.15 + 1;
    feats.forEach(function (f) {
      if (!egne[parseInt(f.id, 10)] || !f.geometry) return;
      const g = f.geometry;
      const polys = g.type === "Polygon" ? [g.coordinates] : (g.type === "MultiPolygon" ? g.coordinates : []);
      polys.forEach(function (pc) {
        const c = d3.geoCentroid({ type: "Polygon", coordinates: pc });
        let lon = c[0];
        if (lon < bx[0] - mx) lon += 360;
        if (lon >= bx[0] - mx && lon <= bx[2] + mx && c[1] >= bx[1] - my && c[1] <= bx[3] + my) dele.push(pc);
      });
    });
  }
  const punkter = pins.concat(smaa || !dele.length ? rammePunkter(bb) : []);
  const indhold = dele.length
    ? { type: "GeometryCollection", geometries: [{ type: "MultiPolygon", coordinates: dele }, { type: "MultiPoint", coordinates: punkter }] }
    : { type: "MultiPoint", coordinates: punkter };
  const s = bb[1], n = bb[3];
  const pad = 26;
  const proj = d3.geoConicEqualArea()
    .rotate([-cx, 0])
    .parallels([s + (n - s) / 6, n - (n - s) / 6])
    .fitExtent([[ramme.x + pad, ramme.y + pad], [ramme.x + ramme.w - pad, ramme.y + ramme.h - pad]], indhold)
    .clipExtent([[ramme.x, ramme.y], [ramme.x + ramme.w, ramme.y + ramme.h]]);
  const sti = d3.geoPath(proj).digits(1);
  let nabo = "", eget = "";
  feats.forEach(function (f) {
    const p = sti(f);
    if (!p) return;
    if (egne[parseInt(f.id, 10)]) eget += p; else nabo += p;
  });
  const svg = sRect(ramme.x, ramme.y, ramme.w, ramme.h, "#ffffff")
    + '<path d="' + nabo + '" fill="' + E.naboFyld + '" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>'
    + '<path d="' + eget + '" fill="' + E.landFyld + '" stroke="' + E.landKant + '" stroke-width="1.1" stroke-linejoin="round"/>';
  return {
    svg: svg,
    proj: function (ll) { return proj(ll); },
    centrum: d.land ? proj([d.land.c[0], d.land.c[1]]) : null
  };
}
/* Stort, dæmpet landenavn midt i landet – springes over, hvis det ville ligge oven på prikker.
   punkter: [[x, y, radius], …] */
function vandmaerke(tg, d, kortet, ramme, start, punkter) {
  if (!kortet.centrum) return;
  const x = kortet.centrum[0], y = kortet.centrum[1];
  if (x < ramme.x || x > ramme.x + ramme.w || y < ramme.y || y > ramme.y + ramme.h) return;
  const t = d.navnKort.toUpperCase();
  const s = passendeStr(t, ramme.w * 0.45, start, 14, 700, 0.3);
  const bw = maal(t, s, 700, s * 0.3);
  const ramt = (punkter || []).some(function (p) {
    const r = (p[2] || 0) + 6;
    return p[0] + r > x - bw / 2 && p[0] - r < x + bw / 2 && p[1] + r > y - s * 0.8 && p[1] - r < y + s * 0.2;
  });
  if (ramt) return;
  tg.former.push('<text x="' + f1(x) + '" y="' + f1(y) + '" text-anchor="middle" font-size="' + s
    + '" font-weight="700" letter-spacing="' + f1(s * 0.3) + '" fill="' + CONFIG.eksport.accentfarve
    + '" fill-opacity="0.2">' + esc(t) + "</text>");
}

/* ---------- Fælles byggeklodser ---------- */
function hoved(tg, d, x, y, maxB, titelStr) {
  const E = CONFIG.eksport;
  tekst(tg, { x: x, y: y, w: maxB, t: E.overlinje, str: 13, vaegt: 700, farve: "#1f5f9e", bogstav: 1.8, linjeH: 18 });
  const s = passendeStr(d.titel, maxB, titelStr, 28, 700);
  const tt = tekst(tg, { x: x, y: y + 24, w: maxB, t: d.titel, str: s, vaegt: 700, farve: E.tekstfarve, linjeH: Math.round(s * 1.15) });
  const sy = y + 24 + tt.h + 6;
  const st = tekst(tg, { x: x, y: sy, w: maxB, t: d.undertitel, str: 19, farve: E.daempet, linjeH: 24 });
  return sy + st.h;
}
function signaturMaal(d, maxB, str) {
  let x = 0, raekker = 1;
  d.typer.forEach(function (t) {
    const w = 16 + maal(t.navn + " (" + t.antal + ")", str, 400) + 22;
    if (x + w > maxB && x > 0) { x = 0; raekker++; }
    x += w;
  });
  return raekker * (str + 10) - 4;
}
function signatur(tg, d, x0, y0, maxB, str) {
  let x = x0, y = y0;
  const lh = str + 6;
  d.typer.forEach(function (t) {
    const label = t.navn + " (" + t.antal + ")";
    const w = 16 + maal(label, str, 400) + 22;
    if (x + w > x0 + maxB && x > x0) { x = x0; y += str + 10; }
    tg.former.push(sCirkel(x + 6, y + lh / 2, 6, t.farve, ' stroke="#000000" stroke-opacity="0.25" stroke-width="1"'));
    tekst(tg, { x: x + 16, y: y, w: w, t: label, str: str, farve: CONFIG.eksport.broedtekst, linjeH: lh });
    x += w;
  });
  return y + lh;
}
/* Detaljerne for en by: virksomheder (eller afdelinger ved ét firma), evt. med typefarve */
function detaljeRuns(b, typer, farve) {
  const runs = [];
  b.detaljer.forEach(function (x, i) {
    if (typer) runs.push({ t: "● ", farve: x.farve, lim: true });
    runs.push({ t: x.navn + (i < b.detaljer.length - 1 ? ", " : ""), farve: farve });
  });
  return runs;
}
function byAntalTekst(b) { return b.navn + " (" + b.antal + ")"; }
function prikRadius(b) { return 3.5 + 1.6 * Math.sqrt(b.antal); }
function prikFarve(b, typer) { return typer ? (b.farve || "#55657a") : CONFIG.eksport.accentfarve; }

/* ---------- Layout A: callout-kort (16:9) ---------- */
async function layoutCallout(d, v) {
  const E = CONFIG.eksport, W = 1600, H = 900, tg = nyTegning(W, H);
  const fakta = v.fakta && !d.enkeltFirma, typer = v.typer, accent = E.accentfarve;
  let overloeb = false;

  /* Kilde og evt. signatur nederst til venstre bestemmer kortets bund */
  const kildeY = 856;
  let kortBund = 850;
  if (typer && d.typer.length) {
    const sh = signaturMaal(d, 1030, 13);
    const sy = kildeY - 14 - sh;
    signatur(tg, d, 64, sy, 1030, 13);
    kortBund = sy - 10;
  }

  const kolH = { x: 1152, w: 416, top: 186, bund: 874, kant: 1140, albue: 1112, hoejre: true };
  const kolV = { x: 64, w: 300, top: 196, bund: kortBund - 4, kant: 376, albue: 404, hoejre: false };
  const capH = kolH.bund - kolH.top, capV = kolV.bund - kolV.top;
  const trinListe = [{ str: 14.5, lh: 20, gap: 12 }, { str: 13.5, lh: 18.5, gap: 10 },
                     { str: 12.5, lh: 17, gap: 8 }, { str: 12, lh: 16, gap: 6 }];
  const runsFor = function (b) {
    const stor = b.antal >= 10;
    const runs = [{ t: b.navn, vaegt: 700, farve: accent }];
    if (!d.enkeltFirma) runs.push({ t: String(b.antal), pille: { bg: stor ? accent : "#dfe9f3", fg: stor ? "#ffffff" : accent } });
    else runs.push({ t: "  " });
    return runs.concat(detaljeRuns(b, typer, E.broedtekst));
  };
  const oevrigeRuns = function (liste) {
    return [{ t: "Other locations", vaegt: 700, farve: accent },
            { t: "  " + liste.map(byAntalTekst).join(", "), farve: E.broedtekst }];
  };
  const itemH = function (b, t, kol) { return antalLinjer(runsFor(b), kol.w, t.str) * t.lh; };
  const hoejde = function (items, t, kol) {
    let h = 0;
    items.forEach(function (b, i) { h += itemH(b, t, kol) + (i ? t.gap : 0); });
    return h;
  };
  const oevH = function (liste, t) { return liste.length ? Math.min(6, antalLinjer(oevrigeRuns(liste), kolH.w, t.str)) * t.lh + t.gap : 0; };

  /* Kortramme – foreløbig, til at fordele byerne i venstre/højre kolonne */
  const top = 172;
  let ramme = { x: fakta ? 300 : 40, y: top, w: 0, h: kortBund - top };
  ramme.w = 1120 - ramme.x;
  let kortet = await kortLag(d, ramme);
  const medK = d.byer.filter(function (b) { return b.ll; });
  const udenK = d.byer.filter(function (b) { return !b.ll; });
  medK.forEach(function (b) { b.p = kortet.proj(b.ll); });
  let venstre = [], hoejre = medK.slice(), brugV = false;
  if (!fakta) {
    /* Venstre kolonne bruges til byer i den vestlige del, eller når der er for mange byer til én kolonne */
    const graense = ramme.x + ramme.w * 0.42;
    const kandidater = medK.filter(function (b) { return b.p[0] < graense; });
    const mindst = trinListe[trinListe.length - 1];
    const forMange = hoejde(medK, mindst, kolH) + oevH(udenK, mindst) > capH;
    if (kandidater.length >= 2 || forMange) {
      brugV = true;
      venstre = kandidater;
      hoejre = medK.filter(function (b) { return b.p[0] >= graense; });
      ramme = { x: 392, y: top, w: 1120 - 392, h: kortBund - top };
      kortet = await kortLag(d, ramme);
      medK.forEach(function (b) { b.p = kortet.proj(b.ll); });
    }
  }
  tg.former.push(kortet.svg);
  vandmaerke(tg, d, kortet, ramme, 34, medK.map(function (b) { return [b.p[0], b.p[1], prikRadius(b)]; }));

  /* Panel til højre */
  tg.former.push(sRect(1120, 0, 480, H, "#f3f6f9") + sLinje(1120.5, 0, 1120.5, H, "#dde4ec", 1));
  tg.former.push(sBillede(LOGO.farve, 1268, 52, 300, 56));
  hoved(tg, d, 64, 52, 1030, 44);
  tekst(tg, { x: 1152, y: 146, w: 416, t: (d.enkeltFirma ? "LOCATIONS" : "MEMBERS") + " BY CITY · NORTH TO SOUTH",
              str: 12, vaegt: 700, farve: E.daempet, bogstav: 1.4, linjeH: 16 });
  tekst(tg, { x: 64, y: kildeY, w: 1030, t: d.kildelinje, str: 12, farve: E.daempet, linjeH: 16 });
  if (fakta) faktaKolonne(tg, d, 64, 232, 220);

  /* Flytter byer mellem kolonnerne, til begge kan være der – de østligste
     fra venstre til højre og omvendt */
  const fordel = function (t, oevr) {
    const V = venstre.slice(), Hh = hoejre.slice();
    if (!brugV) return { V: V, H: Hh };
    for (let k = 0; k < 300; k++) {
      const hv = hoejde(V, t, kolV), hh = hoejde(Hh, t, kolH) + oevH(oevr, t);
      if (hv > capV && V.length) {
        const b = V.reduce(function (a, c) { return c.p[0] > a.p[0] ? c : a; });
        if (hh + itemH(b, t, kolH) + t.gap <= capH) { V.splice(V.indexOf(b), 1); Hh.push(b); continue; }
      }
      if (hh > capH && Hh.length) {
        const b = Hh.reduce(function (a, c) { return c.p[0] < a.p[0] ? c : a; });
        if (hv + itemH(b, t, kolV) + t.gap <= capV) { Hh.splice(Hh.indexOf(b), 1); V.push(b); continue; }
      }
      break;
    }
    return { V: V, H: Hh };
  };
  let trin = null, oevrige = udenK.slice();
  for (let i = 0; i < trinListe.length && !trin; i++) {
    const t = trinListe[i], f = fordel(t, oevrige);
    if (hoejde(f.H, t, kolH) + oevH(oevrige, t) <= capH && hoejde(f.V, t, kolV) <= capV) {
      trin = t; venstre = f.V; hoejre = f.H;
    }
  }
  if (!trin) {
    /* For mange byer: de mindste samles i "Other locations" */
    trin = trinListe[trinListe.length - 1];
    overloeb = true;
    const f = fordel(trin, oevrige);
    venstre = f.V; hoejre = f.H;
    const efterAntal = function (a, b) { return b.antal - a.antal || sammenlignEn(a.navn, b.navn); };
    venstre.sort(efterAntal); hoejre.sort(efterAntal);
    while (venstre.length && hoejde(venstre, trin, kolV) > capV) oevrige.push(venstre.pop());
    while (hoejre.length && hoejde(hoejre, trin, kolH) + oevH(oevrige, trin) > capH) oevrige.push(hoejre.pop());
    oevrige.sort(efterAntal);
  }

  /* Ledelinjer, prikker og callouts */
  const linjer = [];
  let oevTop = kolH.bund;
  if (oevrige.length) {
    const ot = tekst(tg, { x: kolH.x, y: 0, w: kolH.w, runs: oevrigeRuns(oevrige), str: trin.str, linjeH: trin.lh, farve: E.broedtekst, maxLinjer: 6 });
    ot.y = kolH.bund - ot.h;
    oevTop = ot.y - trin.gap;
  }
  [[hoejre, Object.assign({}, kolH, { bund: oevTop })], [venstre, kolV]].forEach(function (par) {
    const items = par[0], kol = par[1];
    if (!items.length) return;
    items.sort(function (a, b) { return a.p[1] - b.p[1]; });
    let forrige = kol.top - trin.gap;
    items.forEach(function (b) {
      b.h = antalLinjer(runsFor(b), kol.w, trin.str) * trin.lh;
      b.top = Math.max(b.p[1] - trin.lh / 2, forrige + trin.gap, kol.top);
      forrige = b.top + b.h;
    });
    let graense = kol.bund;
    for (let i = items.length - 1; i >= 0; i--) {
      if (items[i].top + items[i].h > graense) items[i].top = graense - items[i].h;
      graense = items[i].top - trin.gap;
    }
    forrige = kol.top - trin.gap;
    items.forEach(function (b) {
      if (b.top < forrige + trin.gap) b.top = forrige + trin.gap;
      forrige = b.top + b.h;
      tekst(tg, { x: kol.x, y: b.top, w: kol.w, runs: runsFor(b), str: trin.str, linjeH: trin.lh, farve: E.broedtekst });
      const my = b.top + trin.lh / 2;
      const ax = kol.hoejre ? Math.max(kol.albue, b.p[0] + 8) : Math.min(kol.albue, b.p[0] - 8);
      linjer.push('<polyline points="' + f1(b.p[0]) + "," + f1(b.p[1]) + " " + f1(ax) + "," + f1(my) + " "
        + f1(kol.kant) + "," + f1(my) + '" fill="none" stroke="#8ea4bb" stroke-width="1"/>');
    });
  });
  tg.former.push(linjer.join(""));
  medK.slice().sort(function (a, b) { return b.antal - a.antal; }).forEach(function (b) {
    tg.former.push(sCirkel(b.p[0], b.p[1], prikRadius(b), prikFarve(b, typer), ' stroke="#ffffff" stroke-width="1.5"'));
  });
  return { sider: [tg], format: "16x9", overloeb: overloeb, skjulte: oevrige.length };
}
function faktaKolonne(tg, d, x, y, w) {
  const E = CONFIG.eksport;
  let cy = y;
  d.fakta.felter.forEach(function (f) {

/* ---------- Layout B: kort + bytabel (16:9) ---------- */
function placerBobler(noder, ramme) {
  noder.forEach(function (n) { n.x = n.p[0]; n.y = n.p[1]; });
  const klem = function (n) {
    n.x = Math.min(Math.max(n.x, ramme.x + n.r + 2), ramme.x + ramme.w - n.r - 2);
    n.y = Math.min(Math.max(n.y, ramme.y + n.r + 2), ramme.y + ramme.h - n.r - 2);
  };
  for (let it = 0; it < 480; it++) {
    let flyttet = false;
    for (let i = 0; i < noder.length; i++) {
      for (let j = i + 1; j < noder.length; j++) {
        const a = noder[i], b = noder[j];
        let dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
        const min = a.r + b.r + 3;
        if (dist >= min) continue;
        if (dist < 0.01) { dx = Math.cos(i * 2.4 + j); dy = Math.sin(i * 2.4 + j); dist = 1; }
        const skub = min - dist, ux = dx / dist, uy = dy / dist;
        const wa = b.r / (a.r + b.r), wb = a.r / (a.r + b.r);
        a.x -= ux * skub * wa; a.y -= uy * skub * wa;
        b.x += ux * skub * wb; b.y += uy * skub * wb;
        flyttet = true;
      }
    }
    const traek = it < 400 ? 0.03 : 0;
    noder.forEach(function (n) { n.x += (n.p[0] - n.x) * traek; n.y += (n.p[1] - n.y) * traek; klem(n); });
    if (!flyttet && it > 30) break;
  }
}
function overlapSum(r, liste) {
  let sum = 0;
  liste.forEach(function (o) {
    const w = Math.min(r.x1, o.x1) - Math.max(r.x0, o.x0), h = Math.min(r.y1, o.y1) - Math.max(r.y0, o.y0);
    if (w > 0 && h > 0) sum += w * h;
  });
  return sum;
}
/* Bynavne ved siden af boblerne – prøver højre, venstre, over og under */
function placerEtiketter(tg, noder, ramme, str, maks) {
  const optaget = noder.map(function (n) { return { x0: n.x - n.r, y0: n.y - n.r, x1: n.x + n.r, y1: n.y + n.r }; });
  let sprunget = 0;
  noder.slice().sort(function (a, b) { return b.r - a.r || b.antal - a.antal; }).forEach(function (n, idx) {
    if (maks && idx >= maks) return;
    const stor = n.antal >= 10, s = stor ? str + 1.5 : str, vaegt = stor ? 700 : 600;
    const bw = maal(n.navn, s, vaegt), bh = s + 3;
    const kand = [
      { x: n.x + n.r + 5, y: n.y - bh / 2 },
      { x: n.x - n.r - 5 - bw, y: n.y - bh / 2 },
      { x: n.x - bw / 2, y: n.y - n.r - 3 - bh },
      { x: n.x - bw / 2, y: n.y + n.r + 3 }
    ];
    let bedst = null, bedstO = Infinity;
    kand.forEach(function (k) {
      const r = { x0: k.x, y0: k.y, x1: k.x + bw, y1: k.y + bh };
      if (r.x0 < ramme.x + 2 || r.x1 > ramme.x + ramme.w - 2 || r.y0 < ramme.y + 2 || r.y1 > ramme.y + ramme.h - 2) return;
      const o = overlapSum(r, optaget);
      if (o < bedstO) { bedst = r; bedstO = o; }
    });
    if (!bedst || bedstO > bw * bh * 0.12) { sprunget++; return; }
    optaget.push(bedst);
    tekst(tg, { x: bedst.x0, y: bedst.y0, w: bw + 4, t: n.navn, str: s, vaegt: vaegt, farve: "#1d3047",
                linjeH: bh, halo: true, iBillede: true });
  });
  return sprunget;
}
async function layoutTabel(d, v) {
  const E = CONFIG.eksport, W = 1600, H = 900, tg = nyTegning(W, H);
  const fakta = v.fakta && !d.enkeltFirma, typer = v.typer, accent = E.accentfarve;
  let overloeb = false;

  const kildeY = 864;
  let kortBund = 856;
  if (typer && d.typer.length) {
    const sh = signaturMaal(d, 880, 13);
    const sy = kildeY - 12 - sh;
    signatur(tg, d, 48, sy, 880, 13);
    kortBund = sy - 8;
  }
  const ramme = { x: 0, y: 160, w: 960, h: kortBund - 160 };
  const kortet = await kortLag(d, ramme);
  tg.former.push(kortet.svg);
  hoved(tg, d, 48, 44, 880, 42);
  tekst(tg, { x: 48, y: kildeY, w: 880, t: d.kildelinje, str: 12, farve: E.daempet, linjeH: 16 });

  /* Bobler */
  const noder = d.byer.filter(function (b) { return b.ll; }).map(function (b) {
    return { by: b, navn: b.navn, antal: b.antal, p: kortet.proj(b.ll), r: Math.min(26, 9 + 3.2 * Math.sqrt(b.antal)) };
  });
  placerBobler(noder, ramme);
  vandmaerke(tg, d, kortet, ramme, 36, noder.map(function (n) { return [n.x, n.y, n.r + 30]; }));
  let ud = "";
  noder.forEach(function (n) {
    if (Math.hypot(n.x - n.p[0], n.y - n.p[1]) > 3) {
      ud += sLinje(n.p[0], n.p[1], n.x, n.y, E.daempet, 1, ' stroke-opacity="0.7"') + sCirkel(n.p[0], n.p[1], 2.6, accent);
    }
  });
  noder.slice().sort(function (a, b) { return b.r - a.r; }).forEach(function (n) {
    const fyld = typer ? (n.by.farve || "#55657a") : E.boblefarve;
    ud += sCirkel(n.x, n.y, n.r, fyld, ' stroke="#ffffff" stroke-width="2"');
    const fs = n.r > 20 ? 15 : 12;
    ud += '<text x="' + f1(n.x) + '" y="' + f1(n.y + fs * 0.36) + '" text-anchor="middle" font-size="' + fs
      + '" font-weight="700" fill="#ffffff">' + n.antal + "</text>";
  });
  tg.former.push(ud);
  placerEtiketter(tg, noder, ramme, 13, 0);

  /* Panel */
  tg.former.push(sRect(960, 0, 640, H, accent));
  tg.former.push(sBillede(LOGO.hvid, 1292, 47, 260, 48.5));
  const x0 = 1008, bredde = 544;
  let y = 131;
  if (fakta) {
    const kw = (bredde - 40) / 3;
    let maxL = 1;
    d.fakta.felter.forEach(function (f, i) {
      const x = x0 + i * (kw + 20);
      const s = passendeStr(f.tal, kw, 44, 24, 700);
      tekst(tg, { x: x, y: y, w: kw, t: f.tal, str: s, vaegt: 700, farve: "#ffffff", linjeH: 46 });
      const lt = tekst(tg, { x: x, y: y + 52, w: kw, t: f.tekst, str: 13.5, farve: "#d2e0ee", linjeH: 17.5 });
      maxL = Math.max(maxL, lt.linjer.length);
    });
    y += 52 + maxL * 17.5 + 12;
    tekst(tg, { x: x0, y: y, w: bredde, t: "Key figures: " + d.fakta.kilde, str: 12, farve: "#b4c8dd", linjeH: 16 });
    y += 16 + 22;
    tg.former.push(sLinje(x0, y, x0 + bredde, y, "#ffffff", 1, ' stroke-opacity="0.22"'));
    y += 16;
  } else {
    y = 150;
  }
  const kB = 112, kA = 36, mel = 12;
  const xA = x0 + kB + mel, xF = xA + kA + mel, wF = x0 + bredde - xF;
  const hdr = { str: 12, vaegt: 700, farve: "#b4c8dd", bogstav: 1.3, linjeH: 16 };
  tekst(tg, Object.assign({ x: x0, y: y, w: kB, t: "CITY" }, hdr));
  tekst(tg, Object.assign({ x: xA - 10, y: y, w: kA + 10, t: "NO.", just: "end" }, hdr));
  tekst(tg, Object.assign({ x: xF, y: y, w: wF, t: d.enkeltFirma ? "BRANCHES" : "MEMBER COMPANIES" }, hdr));
  y += 22;
  const bund = 868, plads = bund - y;
  const trinListe = [{ str: 12.5, lh: 16.5 }, { str: 12, lh: 16 }, { str: 11.5, lh: 15 }];
  const raekkeH = function (b, t) {
    return Math.max(antalLinjer([{ t: b.navn, vaegt: 700 }], kB, t.str + 1, 700),
                    antalLinjer(detaljeRuns(b, typer), wF, t.str)) * t.lh + 10;
  };
  const restRuns = function (rest) { return [{ t: rest.map(byAntalTekst).join(", "), farve: "#d2e0ee" }]; };
  let trin = null, vis = d.byer.slice(), rest = [];
  for (let i = 0; i < trinListe.length && !trin; i++) {
    let h = 0; vis.forEach(function (b) { h += raekkeH(b, trinListe[i]); });
    if (h <= plads) trin = trinListe[i];
  }
  if (!trin) {
    trin = trinListe[trinListe.length - 1];
    overloeb = true;
    const restH = function () { return rest.length ? Math.min(3, antalLinjer(restRuns(rest), wF, trin.str)) * trin.lh + 10 : 0; };
    let h = 0; vis.forEach(function (b) { h += raekkeH(b, trin); });
    while (vis.length && h + restH() > plads) { const b = vis.pop(); rest.unshift(b); h -= raekkeH(b, trin); }
  }
  const streg = function (yy) { tg.former.push(sLinje(x0, yy, x0 + bredde, yy, "#ffffff", 1, ' stroke-opacity="0.16"')); };
  vis.forEach(function (b) {
    streg(y);
    tekst(tg, { x: x0, y: y + 5, w: kB, t: b.navn, str: trin.str + 1, vaegt: 700, farve: "#ffffff", linjeH: trin.lh });
    tekst(tg, { x: xA - 10, y: y + 5, w: kA + 10, t: String(b.antal), str: trin.str + 1.5, vaegt: 700, farve: "#ffffff", linjeH: trin.lh, just: "end" });
    tekst(tg, { x: xF, y: y + 5, w: wF, runs: detaljeRuns(b, typer, "#d2e0ee"), str: trin.str, farve: "#d2e0ee", linjeH: trin.lh });
    y += raekkeH(b, trin);
  });
  if (rest.length) {
    streg(y);
    tekst(tg, { x: x0, y: y + 5, w: kB + kA + mel, t: "+ " + flertal(rest.length, "more city", "more cities"), str: trin.str + 1, vaegt: 700, farve: "#ffffff", linjeH: trin.lh });
    const rt = tekst(tg, { x: xF, y: y + 5, w: wF, runs: restRuns(rest), str: trin.str, farve: "#d2e0ee", linjeH: trin.lh, maxLinjer: 3 });
    y += rt.h + 10;
  }
  streg(y);
  return { sider: [tg], format: "16x9", overloeb: overloeb, skjulte: rest.length };
}

/* ---------- Layout C: faktaark (A4, evt. flere sider) ---------- */
async function layoutFaktaark(d, v) {
  const E = CONFIG.eksport, W = 794, H = 1123, accent = E.accentfarve;
  const fakta = v.fakta && !d.enkeltFirma, typer = v.typer;
  const sider = [];
  let tg = nyTegning(W, H);
  sider.push(tg);

  /* Toppen */
  const bandH = fakta ? 300 : 196;
  tg.former.push(sRect(0, 0, W, bandH, accent));
  tg.former.push(sBillede(LOGO.hvid, 40, 39, 220, 41));
  tekst(tg, { x: 434, y: 38, w: 320, t: "COUNTRY FACT SHEET", str: 12, vaegt: 700, farve: "#b4c8dd", bogstav: 1.6, linjeH: 16, just: "end" });
  tekst(tg, { x: 434, y: 56, w: 320, t: d.maaned, str: 13, farve: "#d2e0ee", linjeH: 18, just: "end" });
  const ts = passendeStr(d.titel, 714, 34, 22, 700);
  const tt = tekst(tg, { x: 40, y: 106, w: 714, t: d.titel, str: ts, vaegt: 700, farve: "#ffffff", linjeH: Math.round(ts * 1.15) });
  tekst(tg, { x: 40, y: 106 + tt.h + 8, w: 714, t: d.undertitel, str: 16, farve: "#d2e0ee", linjeH: 21 });
  if (fakta) {
    const kw = (714 - 48) / 3;
    d.fakta.felter.forEach(function (f, i) {
      const x = 40 + i * (kw + 24);
      const s = passendeStr(f.tal, kw, 38, 22, 700);
      tekst(tg, { x: x, y: 198, w: kw, t: f.tal, str: s, vaegt: 700, farve: "#ffffff", linjeH: 40 });
      tekst(tg, { x: x, y: 242, w: kw, t: f.tekst, str: 13.5, farve: "#d2e0ee", linjeH: 17.5, maxLinjer: 2 });
    });
  }

  /* Kort og byliste */
  const sekTop = bandH + 26, kortH = 368;
  const ramme = { x: 32, y: sekTop, w: 460, h: kortH };
  const kortet = await kortLag(d, ramme);
  tg.former.push(kortet.svg);
  const noder = d.byer.filter(function (b) { return b.ll; }).map(function (b) {
    const p = kortet.proj(b.ll);
    return { by: b, navn: b.navn, antal: b.antal, p: p, x: p[0], y: p[1], r: 2.5 + 1.4 * Math.sqrt(b.antal) };
  });
  vandmaerke(tg, d, kortet, ramme, 22, noder.map(function (n) { return [n.x, n.y, n.r + 20]; }));
  noder.slice().sort(function (a, b) { return b.r - a.r; }).forEach(function (n) {
    tg.former.push(sCirkel(n.x, n.y, n.r, prikFarve(n.by, typer), ' stroke="#ffffff" stroke-width="1.2"'));
  });
  placerEtiketter(tg, noder, ramme, 12, 8);
  let kortBund = sekTop + kortH;
  if (typer && d.typer.length) kortBund = signatur(tg, d, 40, kortBund + 8, 452, 12);

  tekst(tg, { x: 516, y: sekTop - 2, w: 238, t: "LOCATIONS BY CITY", str: 12, vaegt: 700, farve: E.daempet, bogstav: 1.4, linjeH: 16 });
  const rh = 24, listeTop = sekTop + 22;
  const maksR = Math.max(3, Math.floor((kortH + 4 - 22) / rh));
  let visB = d.byer.slice(), restB = [];
  if (visB.length > maksR) { restB = visB.slice(maksR - 1); visB = visB.slice(0, maksR - 1); }
  let ly = listeTop;
  visB.forEach(function (b) {
    tekst(tg, { x: 516, y: ly + 3, w: 196, t: b.navn, str: 13.5, vaegt: 600, farve: E.tekstfarve, linjeH: 17, maxLinjer: 1 });
    tekst(tg, { x: 712, y: ly + 3, w: 42, t: String(b.antal), str: 14, vaegt: 700, farve: accent, linjeH: 17, just: "end" });
    tg.former.push(sLinje(516, ly + rh - 0.5, 754, ly + rh - 0.5, "#e1e7ee", 1));
    ly += rh;
  });
  if (restB.length) {
    tekst(tg, { x: 516, y: ly + 3, w: 238, t: "+ " + flertal(restB.length, "more city", "more cities") + " (see list below)", str: 12.5, farve: E.daempet, linjeH: 17 });
    ly += rh;
  }

  /* Virksomheder og deres byer – fortsætter på næste side, hvis det ikke kan være der */
  const footerTop = H - 40 - 40;
  const graense = footerTop - 14;
  let y0 = Math.max(kortBund, ly) + 22;
  tekst(tg, { x: 40, y: y0, w: 714, t: d.enkeltFirma ? "Locations" : "Member companies and their locations", str: 19, vaegt: 600, farve: E.tekstfarve, linjeH: 26 });
  y0 += 36;
  const kolB = 345, kolMel = 24, lh = 18, gap = 6;
  const indgange = d.firmaOversigt.map(function (f) {
    const runs = [];
    if (typer) runs.push({ t: "● ", farve: f.farve, lim: true });
    runs.push({ t: f.navn, vaegt: 700, farve: E.tekstfarve });
    runs.push({ t: "  ·  " + f.byer.join(", "), farve: "#3e5064" });
    return { runs: runs, h: antalLinjer(runs, kolB, 13) * lh };
  });
  let i = 0;
  const nySide = function () {
    tg = nyTegning(W, H);
    sider.push(tg);
    tg.former.push(sRect(0, 0, W, 64, accent));
    tg.former.push(sBillede(LOGO.hvid, 40, 20, 150, 28));
    tekst(tg, { x: 210, y: 22, w: 544, t: d.titel + " (continued)", str: 15, vaegt: 600, farve: "#ffffff", linjeH: 20, just: "end", maxLinjer: 1 });
    return 96;
  };
  while (i < indgange.length) {
    const tilbage = indgange.slice(i);
    const total = tilbage.reduce(function (s, e) { return s + e.h + gap; }, 0);
    const plads = graense - y0;
    let kol1 = [], kol2 = [];
    if (total / 2 + 40 <= plads) {
      /* Alt kan være her: fordel jævnt på to kolonner */
      let h = 0, k = 0;
      while (k < tilbage.length && (h + tilbage[k].h / 2 <= total / 2 || !kol1.length)) { h += tilbage[k].h + gap; kol1.push(tilbage[k]); k++; }
      kol2 = tilbage.slice(k);
      let h2 = kol2.reduce(function (s, e) { return s + e.h + gap; }, 0);
      while (h2 > plads && kol2.length) { kol1.push(kol2.shift()); h2 = kol2.reduce(function (s, e) { return s + e.h + gap; }, 0); }
    } else {
      /* Fyld venstre kolonne, så højre, og fortsæt på ny side */
      let h = 0, k = 0;
      while (k < tilbage.length && h + tilbage[k].h <= plads) { h += tilbage[k].h + gap; kol1.push(tilbage[k]); k++; }
      h = 0;
      while (k < tilbage.length && h + tilbage[k].h <= plads) { h += tilbage[k].h + gap; kol2.push(tilbage[k]); k++; }
      if (!kol1.length) { kol1.push(tilbage[0]); }
    }
    [kol1, kol2].forEach(function (kol, ki) {
      let cy = y0;
      kol.forEach(function (e) {
        tekst(tg, { x: 40 + ki * (kolB + kolMel), y: cy, w: kolB, runs: e.runs, str: 13, linjeH: lh, farve: "#3e5064" });
        cy += e.h + gap;
      });
    });
    i += kol1.length + kol2.length;
    if (i < indgange.length) y0 = nySide();
  }

  /* Bundtekst på hver side */
  sider.forEach(function (s, nr) {
    s.former.push(sLinje(40, footerTop, 754, footerTop, "#d6dee7", 1));
    tekst(s, { x: 40, y: footerTop + 8, w: 714, t: d.kildelinje, str: 12, farve: E.daempet, linjeH: 16, maxLinjer: 1 });
    tekst(s, { x: 40, y: footerTop + 25, w: 610, t: (fakta ? "Key figures: " + d.fakta.kilde + " · " : "") + E.kontakt, str: 12, farve: E.daempet, linjeH: 16, maxLinjer: 1 });
    if (sider.length > 1) tekst(s, { x: 654, y: footerTop + 25, w: 100, t: "Page " + (nr + 1) + " of " + sider.length, str: 12, farve: E.daempet, linjeH: 16, just: "end" });
  });
  return { sider: sider, format: "a4", overloeb: false, skjulte: 0 };
}

async function lavLayout(navn, d, v) {
  if (navn === "tabel") return layoutTabel(d, v);
  if (navn === "faktaark") return layoutFaktaark(d, v);
  return layoutCallout(d, v);
}

/* ---------- Fra tegning til fil ---------- */
async function svgTilCanvas(svg, w, h, skala) {
  const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image();
    await new Promise(function (ok, fejl) {
      img.onload = ok;
      img.onerror = function () { fejl(new Error("Tegningen kunne ikke omsættes til billede")); };
      img.src = url;
    });
    const c = document.createElement("canvas");
    c.width = Math.round(w * skala); c.height = Math.round(h * skala);
    const g = c.getContext("2d");
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
function gemBlob(blob, filnavn) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filnavn;
  document.body.appendChild(a); a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
}
function skalaFor(res) { return res.format === "a4" ? CONFIG.eksport.skalaA4 : CONFIG.eksport.skala16x9; }

async function lavPng(res, filnavn) {
  const s = res.sider[0];
  const c = await svgTilCanvas(tilSvg(s), s.w, s.h, skalaFor(res));
  await new Promise(function (ok) { c.toBlob(function (b) { gemBlob(b, filnavn + ".png"); ok(); }, "image/png"); });
}

/* Liste over alle afdelinger – bruges som bilag, når ikke alle byer kunne være på siden */
function bilagRaekker(d) {
  return d.liste.slice().sort(function (a, b) {
    return sammenlignEn(F(a, "by") || "", F(b, "by") || "") || sammenlignEn(medlemsNavn(a), medlemsNavn(b));
  }).slice(0, CONFIG.eksport.maxBilagRaekker).map(function (r) {
    return [medlemsNavn(r) || "", F(r, "navn") || "", engelskTypenavn(typeEtiket(r)), F(r, "by") || "", F(r, "adresse") || ""];
  });
}
const BILAG_KOLONNER = ["Company", "Branch", "Type", "City", "Address"];

async function lavPdf(res, d, filnavn) {
  await indlaesScript(CONFIG.cdn.jspdf);
  const J = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  const a4 = res.format === "a4";
  const format = a4 ? "a4" : [960, 540];
  const retning = a4 ? "portrait" : "landscape";
  const doc = new J({ orientation: retning, unit: "pt", format: format });
  const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
  for (let i = 0; i < res.sider.length; i++) {
    const s = res.sider[i];
    const c = await svgTilCanvas(tilSvg(s), s.w, s.h, skalaFor(res));
    if (i > 0) doc.addPage(format, retning);
    doc.addImage(c.toDataURL("image/png"), "PNG", 0, 0, pw, ph, undefined, "FAST");
  }
  if (res.overloeb && !a4) tegnBilag(doc, d, format, retning, pw, ph);
  doc.setProperties({ title: d.titel, author: CONFIG.eksport.organisationEn });
  doc.save(filnavn + ".pdf");
}
function tegnBilag(doc, d, format, retning, pw, ph) {
  const accent = CONFIG.eksport.accentfarve, m = 32;
  const bredder = [190, 250, 110, 130, pw - m * 2 - 680];
  const linjeH = 10.5, pad = 3;
  const raekker = bilagRaekker(d);
  let y = 0;
  const sidehoved = function () {
    doc.addPage(format, retning);
    doc.setFillColor(accent); doc.rect(0, 0, pw, 34, "F");
    doc.setTextColor("#ffffff"); doc.setFont("helvetica", "bold"); doc.setFontSize(12);
    doc.text(d.titel + " – all locations", m, 22);
    y = 58;
    doc.setFillColor("#eef4fb"); doc.rect(m, y - 12, pw - m * 2, 17, "F");
    doc.setTextColor("#1c3d5c"); doc.setFontSize(9);
    let x = m + pad;
    BILAG_KOLONNER.forEach(function (k, i) { doc.text(k, x, y); x += bredder[i]; });
    y += 16;
    doc.setFont("helvetica", "normal"); doc.setTextColor("#222222"); doc.setFontSize(8.5);
  };
  sidehoved();
  raekker.forEach(function (r, idx) {
    const celler = r.map(function (v, i) { return doc.splitTextToSize(String(v), bredder[i] - pad * 2); });
    const n = celler.reduce(function (a, c) { return Math.max(a, c.length); }, 1);
    const h = n * linjeH + 4;
    if (y + h > ph - 24) sidehoved();
    if (idx % 2 === 1) { doc.setFillColor("#f7f9fb"); doc.rect(m, y - 9, pw - m * 2, h, "F"); }
    let x = m + pad;
    celler.forEach(function (c, i) { doc.text(c, x, y); x += bredder[i]; });
    y += h;
  });
}

function pptxFarve(c) { return String(c || "#000000").replace("#", "").toUpperCase(); }
async function lavPptx(res, d, filnavn) {
  await indlaesScript(CONFIG.cdn.pptxgen);
  const E = CONFIG.eksport;
  const pptx = new window.PptxGenJS();
  pptx.layout = "LAYOUT_WIDE";                 /* 13,333 × 7,5 tommer */
  pptx.author = E.organisationEn;
  pptx.title = d.titel;
  const tg = res.sider[0];
  const k = 13.333 / tg.w;                     /* tommer pr. px */
  const pt = function (px) { return Math.round(px * k * 72 * 10) / 10; };
  const baggrund = await svgTilCanvas(tilSvg(tg, "billede"), tg.w, tg.h, skalaFor(res));
  const s = pptx.addSlide();
  s.addImage({ data: baggrund.toDataURL("image/png"), x: 0, y: 0, w: 13.333, h: 7.5 });
  tg.tekster.forEach(function (tb) {
    if (tb.iBillede) return;
    const just = tb.just === "end" ? "right" : (tb.just === "middle" ? "center" : "left");
    const faelles = { fontFace: E.pptxSkrift, fontSize: pt(tb.str), lineSpacing: pt(tb.linjeH), align: just };
    const runs = tb.runs.map(function (r) {
      const o = Object.assign({}, faelles, {
        bold: (r.vaegt || tb.vaegt || 400) >= 600,
        color: pptxFarve(r.farve || tb.farve)
      });
      if (r.str) o.fontSize = pt(r.str);
      if (tb.bogstav) o.charSpacing = pt(tb.bogstav);
      if (r.pille) { o.bold = true; o.color = pptxFarve(E.accentfarve); return { text: "  " + r.t + "  ", options: o }; }
      return { text: r.t, options: o };
    });
    s.addText(runs, Object.assign({}, faelles, {
      x: tb.x * k, y: tb.y * k, w: (tb.w + 4) * k, h: (tb.h + 6) * k,
      margin: 0, valign: "top", fit: "none", wrap: true, paraSpaceBefore: 0, paraSpaceAfter: 0
    }));
  });
  if (res.overloeb) {
    const s2 = pptx.addSlide();
    s2.addText(d.titel + " – all locations", { x: 0.5, y: 0.3, w: 12.3, h: 0.45, fontFace: E.pptxSkrift, fontSize: 18, bold: true, color: pptxFarve(E.accentfarve) });
    const raekker = [BILAG_KOLONNER.map(function (t) {
      return { text: t, options: { bold: true, color: "1C3D5C", fill: { color: "EEF4FB" } } };
    })].concat(bilagRaekker(d).map(function (r) { return r.map(function (x) { return String(x); }); }));
    s2.addTable(raekker, {
      x: 0.5, y: 0.9, w: 12.33, colW: [2.5, 3.2, 1.5, 1.7, 3.43],
      fontFace: E.pptxSkrift, fontSize: 8, border: { type: "solid", color: "DDE3EA", pt: 0.5 },
      autoPage: true, autoPageRepeatHeader: true, autoPageLineWeight: -0.4, newSlideStartY: 0.5
    });
  }
  const blob = await pptx.write({ outputType: "blob" });
  gemBlob(blob, filnavn + ".pptx");
}

/* ---------- Eksportdialogen ---------- */
const eksValg = { layout: "callout", fakta: false, typer: false };
let eksData = null, eksResultat = null, eksTaeller = 0;

function eksportNote(tekst, erFejl) {
  const n = $("eksNote");
  n.textContent = tekst || "";
  n.classList.toggle("fejl", !!erFejl);
}
async function aabnEksport() {
  if (!kanEksportere()) return;
  eksData = byggEksportData();
  $("dlgTitel").textContent = "Eksportér kort – " + eksData.navnDa;
  $("lblFakta").hidden = eksData.enkeltFirma;
  $("eksDialog").hidden = false;
  $("dlgLuk").focus();
  await opdaterPreview();
}
function lukEksport() { $("eksDialog").hidden = true; eksResultat = null; }
async function opdaterPreview() {
  const nr = ++eksTaeller;
  const ramme = $("eksPreviewRamme");
  ramme.classList.toggle("a4", eksValg.layout === "faktaark");
  $("eksPptx").hidden = eksValg.layout === "faktaark";
  $("eksPreview").innerHTML = '<div class="dlg-vent">Tegner …</div>';
  eksportNote("");
  try {
    const res = await lavLayout(eksValg.layout, eksData, eksValg);
    if (nr !== eksTaeller) return;
    eksResultat = res;
    $("eksPreview").innerHTML = tilSvg(res.sider[0], "alt", true);
    const noter = [];
    if (res.skjulte) noter.push("Der var ikke plads til alle byer, så de " + res.skjulte
      + " mindste er samlet nederst. PDF og PowerPoint får den fulde liste med som bilag.");
    if (res.sider.length > 1) noter.push("Faktaarket fylder " + res.sider.length + " sider. PNG viser side 1 – PDF har dem alle.");
    if (eksValg.fakta && !eksData.enkeltFirma) {
      noter.push(eksData.fakta.pladsholder
        ? "Faktaboksen viser pladsholdere ([XX]) – der er ikke lagt tal ind for dette land endnu."
        : "Faktaboksen bruger eksempeldata (tallene fra jeres Kina-slide), ikke data fra CRM.");
    }
    const uden = eksData.byer.filter(function (b) { return !b.ll; }).length;
    if (uden) noter.push(uden + " by(er) mangler koordinater og står kun i listen.");
    eksportNote(noter.join(" "));
  } catch (e) {
    if (nr !== eksTaeller) return;
    console.error("Preview-fejl:", e);
    $("eksPreview").innerHTML = "";
    eksportNote(fejlTekst(e), true);
  }
}
function fejlTekst(e) {
  const tekst = String((e && e.message) || e);
  if (/Kunne ikke hente/.test(tekst)) {
    return "Et bibliotek kunne ikke hentes fra nogen af adresserne (" + tekst.replace(/^.*adresserne: /, "")
      + "). Værterne er formentlig blokeret på netværket – send linjen fra Console (F12) i chatten.";
  }
  if (/Grænsedata/.test(tekst)) return "Landegrænserne kunne ikke hentes (" + tekst + "). Prøv igen om lidt.";
  return "Eksporten gik galt: " + tekst + " – tryk F12 og send fejlteksten fra Console i chatten.";
}
async function eksporter(format) {
  if (!eksResultat || !eksData) return;
  const navne = { callout: "callout", tabel: "kort-og-tabel", faktaark: "faktaark" };
  const filnavn = "afdelingskort_" + slug(eksData.navnKort) + "_" + navne[eksValg.layout] + "_" + idagISO();
  visEksportSkaerm(format === "pptx" ? "Bygger PowerPoint …" : "Bygger " + format.toUpperCase() + " …");
  try {
    if (format === "png") await lavPng(eksResultat, filnavn);
    else if (format === "pdf") await lavPdf(eksResultat, eksData, filnavn);
    else await lavPptx(eksResultat, eksData, filnavn);
  } catch (e) {
    console.error("Eksportfejl:", e);
    eksportNote(fejlTekst(e), true);
  } finally { skjulEksportSkaerm(); }
}
function opdaterEksportKnap() {
  const k = $("fEksport");
  if (!k) return;
  const ok = kanEksportere();
  k.disabled = !ok;
  const flere = synligListe.length && landeNoegler(synligListe).length > 1;
  $("eksHint").textContent = ok ? "" : (flere ? "Vælg ét land for at eksportere kortet" : "");
  k.title = ok ? "Eksportér visningen som billede, PDF eller PowerPoint" : "Eksport kræver, at visningen kun rummer ét land";
}
let eksKnapperKlar = false;
function opsaetEksportknapper() {
  if (eksKnapperKlar) return;
  eksKnapperKlar = true;
  $("fExcel").addEventListener("click", eksporterExcel);
  $("fEksport").addEventListener("click", aabnEksport);
  $("dlgLuk").addEventListener("click", lukEksport);
  $("eksDialog").addEventListener("click", function (e) { if (e.target === $("eksDialog")) lukEksport(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("eksDialog").hidden) lukEksport(); });
  Array.prototype.forEach.call(document.querySelectorAll('input[name="eksLayout"]'), function (r) {
    r.addEventListener("change", function () { if (r.checked) { eksValg.layout = r.value; opdaterPreview(); } });
  });
  $("eksFakta").addEventListener("change", function () { eksValg.fakta = $("eksFakta").checked; opdaterPreview(); });
  $("eksTyper").addEventListener("change", function () { eksValg.typer = $("eksTyper").checked; opdaterPreview(); });
  $("eksPng").addEventListener("click", function () { eksporter("png"); });
  $("eksPdf").addEventListener("click", function () { eksporter("pdf"); });
  $("eksPptx").addEventListener("click", function () { eksporter("pptx"); });
}
