<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>whoAmI (OAuth2) smoke test</title>
  <base target="_top">
  <script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:24px;font-size:15px}
    button{background:#1a73e8;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:15px}
    pre{background:#f6f8fa;border:1px solid #ddd;padding:12px;border-radius:4px;white-space:pre-wrap;word-break:break-all}
    .hint{color:#555}
  </style>
</head>
<body>
  <h3>Stage 1 (OAuth2, external) — Who am I?</h3>
  <p class="hint">Click the button. The box shows what the server returns for <code>zoho.loginuser</code>.
     With OAuth2 + a logged-in session, this should be YOUR email, not "Public".</p>
  <button onclick="whoami()">Who am I?</button>
  <pre id="out">(no result yet)</pre>

  <script>
    var WORKSPACE = "danskemaritime";
    var API_NAME  = "whoAmI";

    function whoami(){
      document.getElementById("out").innerText = "calling...";
      if(typeof ZOHO === "undefined" || !ZOHO.CREATOR){
        document.getElementById("out").innerText = "SDK not loaded — check the widget is opened inside a Creator page.";
        return;
      }
      ZOHO.CREATOR.DATA.invokeCustomApi({
        api_name:       API_NAME,
        workspace_name: WORKSPACE,
        http_method:    "GET"
      })
      .then(function(resp){
        document.getElementById("out").innerText = JSON.stringify(resp, null, 2);
      })
      .catch(function(err){
        document.getElementById("out").innerText = "ERROR:\n" + JSON.stringify(err, null, 2);
      });
    }
  </script>
</body>
</html>
