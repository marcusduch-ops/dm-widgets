<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <style>
    :root{
      --accent:#E6335A;        /* crimson accent (matcher Zoho-temaet) */
      --accent-dark:#C71F45;
      --navy:#1f2d5a;
      --bg:#f4f6f8;
      --line:#e3e6ea;
      --ink:#2a2f45;
    }
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
    .wrap{padding:18px}
    h2{margin:0 0 14px;color:var(--navy);font-size:20px}
    .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;
      background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
    label{font-size:13px;color:#555}
    select,input[type=date]{padding:6px 8px;border:1px solid #cfd4da;border-radius:6px;font-size:14px}
    .quick button{margin-left:4px;padding:6px 11px;border:1px solid #cfd4da;background:#fff;border-radius:6px;cursor:pointer;font-size:13px}
    .quick button:hover{background:#f0f2f5}
    #csvBtn{padding:7px 15px;border:none;background:var(--accent);color:#fff;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600}
    #csvBtn:hover{background:var(--accent-dark)}
    #csvBtn:disabled{background:#c9ccd2;cursor:default}

    .summary{display:flex;gap:16px;margin:0 0 16px;flex-wrap:wrap}
    .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;min-width:140px;
      box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .card .lbl{font-size:12px;color:#6b7280;margin-bottom:4px}
    .card .val{font-size:22px;font-weight:700;color:var(--navy)}
    .bar{height:10px;border-radius:5px;background:#eceef1;overflow:hidden;min-width:120px;margin-top:6px}
    .bar>span{display:block;height:100%}

    .panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;
      box-shadow:0 1px 2px rgba(0,0,0,.04)}
    table{border-collapse:collapse;width:100%}
    th,td{padding:9px 12px;text-align:center;font-size:14px;border-bottom:1px solid var(--line)}
    th{background:var(--accent);color:#fff;font-weight:600}
    td:first-child,th:first-child{text-align:left}
    tr.wp td{background:#fbe9ee;font-weight:700;color:var(--navy)}
    tr.emp td.sub{padding-left:34px;font-weight:400}
    tr.emp td{color:#3a3f52}
    tfoot td{font-weight:700;background:#f3f0f5;color:var(--navy)}
    .num{text-align:right;font-variant-numeric:tabular-nums}
    .ok{color:#137333}.warn{color:#d97706}.over{color:var(--accent-dark);font-weight:700}
    .muted{color:#8a90a0}
    .info{padding:18px;color:#8a90a0}
  </style>
</head>
<body>
 <div class="wrap">
  <h2>Projekt tids- og budgetrapport</h2>
  <div class="controls">
    <label>Projekt:
      <select id="proj" onchange="loadReport()"><option value="">— vælg —</option></select>
    </label>
    <label>Fra <input type="date" id="from" onchange="loadReport()"></label>
    <label>Til <input type="date" id="to" onchange="loadReport()"></label>
    <span class="quick">
      <button onclick="setRange('week')">Denne uge</button>
      <button onclick="setRange('month')">Denne måned</button>
      <button onclick="setRange('year')">I år</button>
      <button onclick="setRange('all')">Al tid</button>
    </span>
    <button id="csvBtn" onclick="downloadCsv()" disabled>&#8681; Download CSV</button>
  </div>

  <div id="summary"></div>
  <div id="out" class="info">Vælg et projekt for at se arbejdspakker, personerne på dem og budgetforbrug.</div>
 </div>

  <script>
    var WORKSPACE="danskemaritime";
    var current=null;

    function api(name,method,extra){
      var cfg={api_name:name,workspace_name:WORKSPACE,http_method:method};
      if(extra){ for(var k in extra){ cfg[k]=extra[k]; } }
      return ZOHO.CREATOR.DATA.invokeCustomApi(cfg);
    }
    function unwrap(r){ var x=(r&&r.result!==undefined)?r.result:(r&&r.data!==undefined?r.data:r); if(typeof x==="string"){try{x=JSON.parse(x);}catch(e){}} return x; }
    function iso(d){ return d.toISOString().slice(0,10); }
    function fmt(n){ return (Math.round(n*100)/100).toString().replace(".",","); }   // dansk komma

    function setRange(kind){
      var now=new Date(), f=null, t=null;
      if(kind==="week"){ var dow=(now.getDay()+6)%7; f=new Date(now); f.setDate(now.getDate()-dow); t=new Date(f); t.setDate(f.getDate()+6); }
      else if(kind==="month"){ f=new Date(now.getFullYear(),now.getMonth(),1); t=new Date(now.getFullYear(),now.getMonth()+1,0); }
      else if(kind==="year"){ f=new Date(now.getFullYear(),0,1); t=new Date(now.getFullYear(),11,31); }
      document.getElementById("from").value = f? iso(f):"";
      document.getElementById("to").value   = t? iso(t):"";
      loadReport();
    }

    function initProjects(){
      api("get_project_report","POST",{payload:{projectId:"",fromStr:"",toStr:""}})
        .then(function(r){
          var d=unwrap(r);
          var sel=document.getElementById("proj");
          (d.projects||[]).forEach(function(pr){
            var o=document.createElement("option"); o.value=pr.project_id; o.text=pr.project_name; sel.add(o);
          });
        })
        .catch(function(e){ document.getElementById("out").innerText="Fejl ved indlæsning: "+JSON.stringify(e); });
    }

    function loadReport(){
      var pid=document.getElementById("proj").value;
      if(!pid){ current=null; document.getElementById("csvBtn").disabled=true; document.getElementById("summary").innerHTML=""; document.getElementById("out").className="info"; document.getElementById("out").innerText="Vælg et projekt."; return; }
      var from=document.getElementById("from").value||"";
      var to=document.getElementById("to").value||"";
      document.getElementById("out").innerText="Indlæser...";
      api("get_project_report","POST",{payload:{projectId:pid,fromStr:from,toStr:to}})
        .then(function(r){ render(unwrap(r)); })
        .catch(function(e){ document.getElementById("out").innerText="Fejl ved indlæsning: "+JSON.stringify(e); });
    }

    function barColor(pct){ return pct>100?"#C71F45":(pct>85?"#d97706":"#137333"); }

    function render(d){
      var s=d.selected;
      if(!s){ document.getElementById("out").innerText="Ingen data."; current=null; document.getElementById("csvBtn").disabled=true; return; }
      current=s; document.getElementById("csvBtn").disabled=false;

      var pct = s.projectBudget>0 ? (s.projectUsed/s.projectBudget*100) : 0;
      var remCls = s.projectRemaining<0?"over":(pct>85?"warn":"ok");
      document.getElementById("summary").innerHTML =
        '<div class="summary">'+
          '<div class="card"><div class="lbl">Budget (t)</div><div class="val">'+fmt(s.projectBudget)+'</div></div>'+
          '<div class="card"><div class="lbl">Forbrugt (t)</div><div class="val">'+fmt(s.projectUsed)+'</div></div>'+
          '<div class="card"><div class="lbl">Resterende (t)</div><div class="val '+remCls+'">'+fmt(s.projectRemaining)+'</div></div>'+
          '<div class="card" style="flex:1;min-width:220px"><div class="lbl">Budget forbrugt '+fmt(pct)+'%</div>'+
            '<div class="bar"><span style="width:'+Math.min(pct,100)+'%;background:'+barColor(pct)+'"></span></div></div>'+
        '</div>';

      var rows=s.rows||[];
      var h='<div class="panel"><table><thead><tr><th>Arbejdspakke / medarbejder</th><th>Timer</th><th>Budget</th><th>Resterende</th></tr></thead><tbody>';
      rows.forEach(function(row){
        var rpct = row.budget>0 ? (row.used/row.budget*100):0;
        var rcls = row.remaining<0?"over":(rpct>85?"warn":"ok");
        h+='<tr class="wp"><td>'+row.idx+'. '+row.work_package+'</td>'+
           '<td class="num">'+fmt(row.used)+'</td>'+
           '<td class="num">'+fmt(row.budget)+'</td>'+
           '<td class="num '+rcls+'">'+fmt(row.remaining)+'</td></tr>';
        if(!row.people || row.people.length===0){
          h+='<tr class="emp"><td class="sub muted">— ingen timer registreret —</td><td></td><td></td><td></td></tr>';
        } else {
          row.people.forEach(function(pp){
            h+='<tr class="emp"><td class="sub">'+pp.name+'</td><td class="num">'+fmt(pp.hours)+'</td><td></td><td></td></tr>';
          });
        }
      });
      h+='</tbody><tfoot><tr><td>I alt</td><td class="num">'+fmt(s.projectUsed)+'</td><td class="num">'+fmt(s.projectBudget)+'</td><td class="num">'+fmt(s.projectRemaining)+'</td></tr></tfoot></table></div>';

      var out=document.getElementById("out"); out.className=""; out.innerHTML=h;
    }

    // ---- CSV-eksport af den viste rapport ----
    function csvCell(v){
      var s=(v===null||v===undefined)?"":(""+v);
      if(s.indexOf('"')>-1 || s.indexOf(';')>-1 || s.indexOf(',')>-1 || s.indexOf('\n')>-1){
        s='"'+s.replace(/"/g,'""')+'"';
      }
      return s;
    }
    function csvNum(n){ return (""+ (Math.round(n*100)/100)).replace(".",","); }  // dansk komma i CSV
    function downloadCsv(){
      if(!current) return;
      var from=document.getElementById("from").value||"al tid";
      var to=document.getElementById("to").value||"al tid";
      var sep=";";                 // dansk Excel bruger semikolon
      var lines=[];
      lines.push(["Projekt",current.project_name].map(csvCell).join(sep));
      lines.push(["Datointerval",from+" til "+to].map(csvCell).join(sep));
      lines.push([]);
      lines.push(["Arbejdspakke","Medarbejder","Timer","AP budget","AP forbrugt","AP resterende"].map(csvCell).join(sep));
      (current.rows||[]).forEach(function(row){
        if(!row.people || row.people.length===0){
          lines.push([row.idx+". "+row.work_package,"","",csvNum(row.budget),csvNum(row.used),csvNum(row.remaining)].map(csvCell).join(sep));
        } else {
          row.people.forEach(function(pp,i){
            if(i===0){
              lines.push([row.idx+". "+row.work_package,pp.name,csvNum(pp.hours),csvNum(row.budget),csvNum(row.used),csvNum(row.remaining)].map(csvCell).join(sep));
            } else {
              lines.push([row.idx+". "+row.work_package,pp.name,csvNum(pp.hours),"","",""].map(csvCell).join(sep));
            }
          });
        }
      });
      lines.push([]);
      lines.push(["I ALT","","","",csvNum(current.projectUsed),csvNum(current.projectRemaining)].map(csvCell).join(sep));

      var csv="\uFEFF"+lines.join("\r\n");  // BOM -> æøå vises korrekt i Excel
      var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
      var fname=(current.project_id||"projekt")+"_"+from+"_"+to+".csv";
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download=fname;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    initProjects();
  </script>
</body>
</html>
