<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base target="_top">
  <script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:16px;color:#222}
    h2{margin:0 0 12px}
    .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    select,input[type=date]{padding:6px;border:1px solid #ccc;border-radius:4px}
    .quick button{margin-left:4px;padding:5px 9px;border:1px solid #ccc;background:#f4f6f8;border-radius:4px;cursor:pointer}
    #csvBtn{padding:6px 14px;border:none;background:#137333;color:#fff;border-radius:4px;cursor:pointer}
    #csvBtn:disabled{background:#bbb;cursor:default}
    table{border-collapse:collapse;width:100%;margin-top:8px}
    th,td{border:1px solid #ddd;padding:6px 8px;text-align:center;font-size:14px}
    th{background:#1a73e8;color:#fff}
    td:first-child,th:first-child{text-align:left}
    tr.wp td{background:#eef3fb;font-weight:700}
    tr.emp td.sub{padding-left:30px;font-weight:400}
    tfoot td{font-weight:700;background:#e3e9f3}
    .num{text-align:right}
    .bar{height:10px;border-radius:5px;background:#e3e6ea;overflow:hidden;min-width:80px}
    .bar>span{display:block;height:100%}
    .ok{color:#137333}.warn{color:#e37400}.over{color:#c5221f;font-weight:700}
    .summary{display:flex;gap:24px;margin:10px 0 4px;flex-wrap:wrap}
    .card{border:1px solid #e0e0e0;border-radius:8px;padding:10px 16px;min-width:130px}
    .card .lbl{font-size:12px;color:#666}.card .val{font-size:20px;font-weight:700}
    .muted{color:#888}
  </style>
</head>
<body>
  <h2>Project time &amp; budget report</h2>
  <div class="controls">
    <label>Project:
      <select id="proj" onchange="loadReport()"><option value="">— choose —</option></select>
    </label>
    <label>From <input type="date" id="from" onchange="loadReport()"></label>
    <label>To <input type="date" id="to" onchange="loadReport()"></label>
    <span class="quick">
      <button onclick="setRange('week')">This week</button>
      <button onclick="setRange('month')">This month</button>
      <button onclick="setRange('year')">This year</button>
      <button onclick="setRange('all')">All time</button>
    </span>
    <button id="csvBtn" onclick="downloadCsv()" disabled>&#8681; Download CSV</button>
  </div>

  <div id="summary"></div>
  <div id="out" class="muted">Choose a project to see work packages, the people on them, and budget use.</div>

  <script>
    var WORKSPACE="danskemaritime";
    var current=null;   // last loaded 'selected' object, for CSV

    function api(name,method,extra){
      var cfg={api_name:name,workspace_name:WORKSPACE,http_method:method};
      if(extra){ for(var k in extra){ cfg[k]=extra[k]; } }
      return ZOHO.CREATOR.DATA.invokeCustomApi(cfg);
    }
    function unwrap(r){ var x=(r&&r.result!==undefined)?r.result:(r&&r.data!==undefined?r.data:r); if(typeof x==="string"){try{x=JSON.parse(x);}catch(e){}} return x; }
    function iso(d){ return d.toISOString().slice(0,10); }
    function fmt(n){ return (Math.round(n*100)/100).toString(); }

    function setRange(kind){
      var now=new Date(), f=null, t=null;
      if(kind==="week"){ var dow=(now.getDay()+6)%7; f=new Date(now); f.setDate(now.getDate()-dow); t=new Date(f); t.setDate(f.getDate()+6); }
      else if(kind==="month"){ f=new Date(now.getFullYear(),now.getMonth(),1); t=new Date(now.getFullYear(),now.getMonth()+1,0); }
      else if(kind==="year"){ f=new Date(now.getFullYear(),0,1); t=new Date(now.getFullYear(),11,31); }
      document.getElementById("from").value = f? iso(f):"";
      document.getElementById("to").value   = t? iso(t):"";
      loadReport();
    }

    function initProjects(){
      api("get_project_report","POST",{payload:{projectId:"",fromStr:"",toStr:""}})
        .then(function(r){
          var d=unwrap(r);
          var sel=document.getElementById("proj");
          (d.projects||[]).forEach(function(pr){
            var o=document.createElement("option"); o.value=pr.project_id; o.text=pr.project_name; sel.add(o);
          });
        })
        .catch(function(e){ document.getElementById("out").innerText="Init error: "+JSON.stringify(e); });
    }

    function loadReport(){
      var pid=document.getElementById("proj").value;
      if(!pid){ current=null; document.getElementById("csvBtn").disabled=true; document.getElementById("summary").innerHTML=""; document.getElementById("out").className="muted"; document.getElementById("out").innerText="Choose a project."; return; }
      var from=document.getElementById("from").value||"";
      var to=document.getElementById("to").value||"";
      document.getElementById("out").innerText="Loading...";
      api("get_project_report","POST",{payload:{projectId:pid,fromStr:from,toStr:to}})
        .then(function(r){ render(unwrap(r)); })
        .catch(function(e){ document.getElementById("out").innerText="Load error: "+JSON.stringify(e); });
    }

    function barColor(pct){ return pct>100?"#c5221f":(pct>85?"#e37400":"#137333"); }

    function render(d){
      var s=d.selected;
      if(!s){ document.getElementById("out").innerText="No data."; current=null; document.getElementById("csvBtn").disabled=true; return; }
      current=s; document.getElementById("csvBtn").disabled=false;

      var pct = s.projectBudget>0 ? (s.projectUsed/s.projectBudget*100) : 0;
      var remCls = s.projectRemaining<0?"over":(pct>85?"warn":"ok");
      document.getElementById("summary").innerHTML =
        '<div class="summary">'+
          '<div class="card"><div class="lbl">Budget (h)</div><div class="val">'+fmt(s.projectBudget)+'</div></div>'+
          '<div class="card"><div class="lbl">Used (h)</div><div class="val">'+fmt(s.projectUsed)+'</div></div>'+
          '<div class="card"><div class="lbl">Remaining (h)</div><div class="val '+remCls+'">'+fmt(s.projectRemaining)+'</div></div>'+
          '<div class="card" style="flex:1;min-width:200px"><div class="lbl">Budget used '+fmt(pct)+'%</div>'+
            '<div class="bar"><span style="width:'+Math.min(pct,100)+'%;background:'+barColor(pct)+'"></span></div></div>'+
        '</div>';

      var rows=s.rows||[];
      var h='<table><thead><tr><th>Work package / employee</th><th>Hours</th><th>Budget</th><th>Remaining</th></tr></thead><tbody>';
      rows.forEach(function(row){
        var rpct = row.budget>0 ? (row.used/row.budget*100):0;
        var rcls = row.remaining<0?"over":(rpct>85?"warn":"ok");
        h+='<tr class="wp"><td>'+row.idx+'. '+row.work_package+'</td>'+
           '<td class="num">'+fmt(row.used)+'</td>'+
           '<td class="num">'+fmt(row.budget)+'</td>'+
           '<td class="num '+rcls+'">'+fmt(row.remaining)+'</td></tr>';
        if(!row.people || row.people.length===0){
          h+='<tr class="emp"><td class="sub muted">— no hours logged —</td><td></td><td></td><td></td></tr>';
        } else {
          row.people.forEach(function(pp){
            h+='<tr class="emp"><td class="sub">'+pp.name+'</td><td class="num">'+fmt(pp.hours)+'</td><td></td><td></td></tr>';
          });
        }
      });
      h+='</tbody><tfoot><tr><td>Total</td><td class="num">'+fmt(s.projectUsed)+'</td><td class="num">'+fmt(s.projectBudget)+'</td><td class="num">'+fmt(s.projectRemaining)+'</td></tr></tfoot></table>';

      var out=document.getElementById("out"); out.className=""; out.innerHTML=h;
    }

    // ---- CSV export of the currently shown report ----
    function csvCell(v){
      var s=(v===null||v===undefined)?"":(""+v);
      if(s.indexOf('"')>-1 || s.indexOf(';')>-1 || s.indexOf(',')>-1 || s.indexOf('\n')>-1){
        s='"'+s.replace(/"/g,'""')+'"';
      }
      return s;
    }
    function downloadCsv(){
      if(!current) return;
      var from=document.getElementById("from").value||"all";
      var to=document.getElementById("to").value||"all";
      var sep=";";                 // Danish Excel uses semicolon
      var lines=[];
      lines.push(["Project",current.project_name].map(csvCell).join(sep));
      lines.push(["Date range",from+" to "+to].map(csvCell).join(sep));
      lines.push([]);
      lines.push(["Work package","Employee","Hours","WP budget","WP used","WP remaining"].map(csvCell).join(sep));
      (current.rows||[]).forEach(function(row){
        if(!row.people || row.people.length===0){
          lines.push([row.idx+". "+row.work_package,"","",row.budget,row.used,row.remaining].map(csvCell).join(sep));
        } else {
          row.people.forEach(function(pp,i){
            // budget columns only on the first line of each work package to avoid double-counting
            if(i===0){
              lines.push([row.idx+". "+row.work_package,pp.name,pp.hours,row.budget,row.used,row.remaining].map(csvCell).join(sep));
            } else {
              lines.push([row.idx+". "+row.work_package,pp.name,pp.hours,"","",""].map(csvCell).join(sep));
            }
          });
        }
      });
      lines.push([]);
      lines.push(["TOTAL","","","",current.projectUsed,current.projectRemaining].map(csvCell).join(sep));

      // BOM so Danish characters (æøå) render correctly in Excel
      var csv="\uFEFF"+lines.join("\r\n");
      var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
      var fname=(current.project_id||"project")+"_"+from+"_"+to+".csv";
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download=fname;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    initProjects();
  </script>
</body>
</html>
