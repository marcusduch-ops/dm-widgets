<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <style>
    :root{--accent:#E6335A;--accent-dark:#C71F45;--navy:#1f2d5a;--bg:#f4f6f8;--line:#e3e6ea;--ink:#2a2f45}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
    .wrap{padding:16px;max-width:1100px;margin:0 auto}
    .head{display:flex;gap:10px;align-items:center;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .head h1{font-size:18px;color:var(--navy);margin:0}
    .head .sub{color:#6b7280;font-size:13px;margin-top:2px}
    .head button{margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
    .head button:hover{background:var(--accent-dark)}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
    .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .card .lbl{font-size:13px;color:#6b7280}
    .card .val{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px}
    .card .val small{font-size:14px;font-weight:600;color:#6b7280}
    .card.accent{border-top:3px solid var(--accent)}
    h3{color:var(--navy);font-size:15px;margin:20px 0 8px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    table{border-collapse:collapse;width:100%}
    th,td{border-bottom:1px solid var(--line);padding:8px 12px;text-align:right;font-size:14px}
    th:first-child,td:first-child{text-align:left}
    th{background:var(--accent);color:#fff;font-weight:600}
    tr:last-child td{border-bottom:none}
    .bar{height:8px;border-radius:4px;background:#eef0f3;overflow:hidden;margin-top:4px}
    .bar>span{display:block;height:100%}
    .ok{color:#137333;font-weight:600}.warn{color:#d97706;font-weight:600}.over{color:var(--accent-dark);font-weight:700}
    .bar-ok>span{background:#137333}.bar-warn>span{background:#d97706}.bar-over>span{background:var(--accent)}
    .muted{color:#9aa0ad}
    #err{color:var(--accent-dark);font-size:14px;padding:10px 0}
    @media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
 <div class="wrap">
  <div class="head">
    <div>
      <h1 id="title">Ledelsesoverblik</h1>
      <div class="sub" id="period">Indlæser ...</div>
    </div>
    <button onclick="load()">Opdatér</button>
  </div>

  <div class="kpis">
    <div class="card accent"><div class="lbl">Timer i alt</div><div class="val" id="k_all">–</div></div>
    <div class="card"><div class="lbl">Projekttimer</div><div class="val" id="k_proj">–</div></div>
    <div class="card"><div class="lbl">Interne timer</div><div class="val" id="k_int">–</div></div>
    <div class="card"><div class="lbl">Fraværstimer</div><div class="val" id="k_frav">–</div></div>
  </div>

  <h3>Projektportefølje &ndash; budget vs. forbrug</h3>
  <div class="panel"><table id="projtbl">
    <thead><tr><th>Projekt</th><th>Budget (t)</th><th>Forbrug (t)</th><th>Forbrug</th></tr></thead>
    <tbody></tbody>
  </table></div>

  <h3>Fravær pr. type</h3>
  <div class="panel"><table id="fravtbl">
    <thead><tr><th>Type</th><th>Timer</th></tr></thead>
    <tbody></tbody>
  </table></div>

  <div id="err"></div>
 </div>

 <script>
  var WORKSPACE="danskemaritime";

  // Samme kaldemønster som den fungerende grid-widget (VERIFICERET)
  function api(name,method,extra){
    var cfg={api_name:name,workspace_name:WORKSPACE,http_method:method};
    if(extra){ for(var k in extra){ cfg[k]=extra[k]; } }
    return ZOHO.CREATOR.DATA.invokeCustomApi(cfg);
  }
  function unwrap(r){ var x=(r&&r.result!==undefined)?r.result:(r&&r.data!==undefined?r.data:r); if(typeof x==="string"){try{x=JSON.parse(x);}catch(e){}} return x; }
  function fmt(n){ return (Math.round((n||0)*100)/100).toString().replace(".",","); }

  // Pæne danske labels til fraværstyper
  var FRAV_LABELS={ferie:"Ferie",sygdom:"Sygdom",barn_syg:"Barn syg",barsel:"Barsel",andet:"Andet",feriefridag:"Feriefridag"};

  function load(){
    document.getElementById("err").innerText="";
    document.getElementById("period").innerText="Indlæser ...";
    api("getLedelsesDashboard","GET",{})
      .then(function(r){ render(unwrap(r)); })
      .catch(function(e){ document.getElementById("err").innerText="Fejl ved indlæsning: "+JSON.stringify(e); });
  }

  function render(d){
    if(!d){ document.getElementById("err").innerText="Ingen data modtaget."; return; }
    document.getElementById("title").innerText="Ledelsesoverblik "+(d.aar||"");
    document.getElementById("period").innerText="Periode: "+(d.from_date||"")+" \u2013 "+(d.to_date||"");

    document.getElementById("k_all").innerHTML = fmt(d.total_all)+" <small>t</small>";
    document.getElementById("k_proj").innerHTML = fmt(d.total_project)+" <small>t</small>";
    document.getElementById("k_int").innerHTML = fmt(d.total_internal)+" <small>t</small>";
    document.getElementById("k_frav").innerHTML = fmt(d.total_fravaer)+" <small>t</small>";

    // Projektportefølje – sorteret efter højeste forbrugsprocent
    var projs=(d.projects||[]).slice().sort(function(a,b){ return (b.pct||0)-(a.pct||0); });
    var pb=document.querySelector("#projtbl tbody"); pb.innerHTML="";
    if(projs.length===0){ pb.innerHTML="<tr><td class='muted' colspan='4'>Ingen projekter.</td></tr>"; }
    projs.forEach(function(p){
      var pct=p.pct||0;
      var cls = pct>100 ? "over" : (pct>=80 ? "warn" : "ok");
      var barcls = pct>100 ? "bar-over" : (pct>=80 ? "bar-warn" : "bar-ok");
      var width=Math.min(pct,100);
      var nameCell = (p.active===false ? "<span class='muted'>"+ (p.project_name||p.project_id) +" (inaktiv)</span>" : (p.project_name||p.project_id));
      var tr=document.createElement("tr");
      tr.innerHTML =
        "<td>"+nameCell+"</td>"+
        "<td>"+fmt(p.budget)+"</td>"+
        "<td>"+fmt(p.forbrug)+"</td>"+
        "<td><span class='"+cls+"'>"+fmt(pct)+" %</span>"+
        "<div class='bar "+barcls+"'><span style='width:"+width+"%'></span></div></td>";
      pb.appendChild(tr);
    });

    // Fravær pr. type – sorteret efter timer
    var fravs=(d.fravaer_by_type||[]).slice().sort(function(a,b){ return (b.timer||0)-(a.timer||0); });
    var fb=document.querySelector("#fravtbl tbody"); fb.innerHTML="";
    if(fravs.length===0){ fb.innerHTML="<tr><td class='muted' colspan='2'>Intet fravær registreret.</td></tr>"; }
    fravs.forEach(function(f){
      var label=FRAV_LABELS[f.type]||f.type;
      var tr=document.createElement("tr");
      tr.innerHTML="<td>"+label+"</td><td>"+fmt(f.timer)+"</td>";
      fb.appendChild(tr);
    });
  }

  load();
 </script>
</body>
</html>
